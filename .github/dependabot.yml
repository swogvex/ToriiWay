version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TS 7 is not yet supported by @astrojs/check or typescript-eslint
      - dependency-name: 'typescript'
        versions: ['>=7']
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns:
          [
            'eslint*',
            'typescript*',
            '@typescript-eslint/*',
            'stylelint*',
            'postcss-html',
            'prettier*',
          ]
      testing:
        patterns: ['vitest', '@playwright/*', '@axe-core/*', '@lhci/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
