# eslint-plugin-jsx-a11y works with ESLint 10 (verified) but its peer range stops at 9.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'

# Patched versions of vulnerable transitive dependencies (see pnpm audit --prod).
# Remove each entry once the parent package ships the fix.
overrides:
  '@vercel/routing-utils>path-to-regexp': 6.3.0
  '@vercel/cli-config>zod': ^4.6.6
  '@vercel/nft>glob': ^14.0.2
  # satori pins fflate 0.7.x; 0.7.5 fixes GHSA-px8p-9vwx-vf98 (ZIP64 infinite loop).
  'fflate@>=0.7.0 <0.7.5': 0.7.5
  # Dev tools only (pnpm audit): patched versions within the API each parent already uses.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  'tmp@<0.2.6': 0.2.7
  '@lhci/cli>uuid': 11.1.1
  'get-uri>basic-ftp': 6.2.3
  'chromium-bidi>zod': 4.6.7
  # extract-zip has no fixed release; @puppeteer/browsers 3 no longer depends on it.
  'puppeteer-core>@puppeteer/browsers': 3.2.5
  # ...which needs proxy-agent 8 as a peer (lhci uses the same ProxyAgent class).
  proxy-agent: 8.0.2

# esbuild ships its binary as an optional package; its install script is not needed.
allowBuilds:
  esbuild: false
