      script: "N: せんせいが　はなして　います。がくせいは　どこを　しゅくだいに　しますか。\nF: きょうの　しゅくだいは　二十ページと　二十一ページです。あ、二十一ページは　らいしゅう　じゅぎょうで　やりますから、二十ページと　二十二ページを　して　ください。\nN: がくせいは　どこを　しゅくだいに　しますか。"
