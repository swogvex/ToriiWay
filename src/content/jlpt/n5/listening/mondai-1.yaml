    answer: 3
    explanation:
      en: 'Monday and Tuesday she works, Wednesday is not good; they choose Thursday.'
      es: 'Lunes y martes trabaja y el miércoles no puede; eligen el jueves.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-1-0011-8cdad8c9192a.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。ふたりは　なんようびに　テニスを　しますか。\nM: らいしゅう、いっしょに　テニスを　しませんか。\nF: いいですね。月よう日と　火よう日は　アルバイトが　あります。\nM: 水よう日は　どうですか。\nF: 水よう日は　ちょっと……。木よう日は　どうですか。\nM: いいですよ。\nN: ふたりは　なんようびに　テニスを　しますか。"
      voices: ['narrator', 'man', 'woman']
  - id: n5-lis-1-0012
