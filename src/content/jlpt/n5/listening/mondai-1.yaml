# N5 · Listening · Mondai 1 — task-based comprehension
# Original questions written for ToriiWay.
level: N5
section: listening
mondai: 1
instruction:
  en: 'Listen to the question first, then the conversation, and choose the best answer.'
  ja: 'はじめに しつもんを きいて ください。それから はなしを きいて、いちばん いい ものを えらんで ください。'
questions:
  - id: n5-lis-1-0001
    stem: 'おとこの　ひとは　なにを　かいますか。'
    choices: ['たまごと　パン', 'ぎゅうにゅうと　パン', 'たまごだけ', 'たまごと　ぎゅうにゅう']
    answer: 1
    explanation:
      en: 'Eggs, and bread was added at the end; there is still milk.'
      es: 'Huevos, y al final añade pan; todavía hay leche.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-1-0001-5012d9b4e179.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。おとこの　ひとは　なにを　かいますか。\nF: スーパーへ　いきますか。じゃ、たまごを　かって　きて　ください。\nM: たまごですね。ぎゅうにゅうは？\nF: ぎゅうにゅうは　まだ　ありますから、いいです。あ、パンも　おねがいします。\nM: わかりました。\nN: おとこの　ひとは　なにを　かいますか。"
      voices: ['narrator', 'woman', 'man']
  - id: n5-lis-1-0002
    stem: 'ふたりは　どこで　あいますか。'
    choices: ['えきの　中', 'えきの　まえ', 'えきの　となりの　きっさてん', 'ほんや']
    answer: 3
    explanation:
      en: 'They change from the station front to the café next to it.'
      es: 'Cambian la entrada de la estación por la cafetería de al lado.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-1-0002-60f413ef0ab2.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。ふたりは　どこで　あいますか。\nF: あしたは　えきの　まえで　あいましょうか。\nM: えきの　まえは　ひとが　おおいですから、えきの　となりの　きっさてんは　どうですか。\nF: いいですね。そう　しましょう。\nN: ふたりは　どこで　あいますか。"
      voices: ['narrator', 'woman', 'man']
  - id: n5-lis-1-0003
    stem: 'ふたりは　なん時に　あいますか。'
    choices: ['二時', '十二時', '一時半', '一時']
    answer: 2
    explanation:
      en: 'They decide to have lunch first, so they meet at twelve.'
      es: 'Deciden comer antes, así que quedan a las doce.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-1-0003-42eef666e32b.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。ふたりは　なん時に　あいますか。\nM: あしたの　えいがは　二時からです。\nF: じゃ、一時半に　あいましょう。\nM: ひるごはんも　いっしょに　たべませんか。\nF: いいですね。じゃ、十二時に　しましょう。\nN: ふたりは　なん時に　あいますか。"
      voices: ['narrator', 'man', 'woman']
  - id: n5-lis-1-0004
    stem: 'がくせいは　あした　なにを　もって　いきますか。'
    choices:
      ['えんぴつと　かみ', 'おべんとうと　えんぴつ', 'のみものと　かみ', 'おべんとうと　のみもの']
    answer: 4
    explanation:
      en: 'Pencils and paper are at school; bring lunch and a drink.'
      es: 'Lápices y papel están en la escuela; hay que llevar comida y bebida.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-1-0004-b7f6d999e73e.mp3'
    tts:
      script: "N: せんせいが　はなして　います。がくせいは　あした　なにを　もって　いきますか。\nF: あしたは　こうえんで　えを　かきます。えんぴつと　かみは　がっこうに　ありますから、いりません。おべんとうと　のみものを　もって　きて　ください。\nN: がくせいは　あした　なにを　もって　いきますか。"
      voices: ['narrator', 'woman']
  - id: n5-lis-1-0005
    stem: 'おとこの　ひとは　なんばんの　バスに　のりますか。'
    choices: ['八ばん', '十五ばん', '五ばん', '三ばん']
    answer: 3
    explanation:
      en: 'Bus 3 is not running now, so he takes bus 5.'
      es: 'El 3 no pasa ahora, así que coge el 5.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-1-0005-3435c0741107.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。おとこの　ひとは　なんばんの　バスに　のりますか。\nM: すみません、びじゅつかんへ　いきたいです。なんばんの　バスですか。\nF: 三ばんです。あ、でも　三ばんは　いま　きません。五ばんに　のって、さくらえきで　おりて　ください。そこから　あるいて　五分です。\nM: ありがとう　ございます。\nN: おとこの　ひとは　なんばんの　バスに　のりますか。"
      voices: ['narrator', 'man', 'woman']
  - id: n5-lis-1-0006
    stem: 'おとこの　ひとは　はじめに　なにを　しますか。'
    choices: ['コピーを　します', 'でんわを　します', 'かいぎに　でます', 'てがみを　だします']
    answer: 1
    explanation:
      en: 'She corrects herself: the copies come first.'
      es: 'Se corrige: primero las copias.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-1-0006-ac108e314ac1.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。おとこの　ひとは　はじめに　なにを　しますか。\nF: かいぎの　まえに、この　てがみを　だして　ください。それから　コピーを　二十まい　おねがいします。\nM: はい。\nF: あ、すみません、コピーが　さきです。かいぎは　十時からですから。\nN: おとこの　ひとは　はじめに　なにを　しますか。"
      voices: ['narrator', 'woman', 'man']
  - id: n5-lis-1-0007
    stem: 'おとこの　がくせいは　どの　きょうしつへ　いきますか。'
    choices: ['二〇一', '三〇一', '三〇二', '一〇一']
    answer: 2
    explanation:
      en: 'Today the class is in 301 because 201 has a test.'
      es: 'Hoy la clase es en el 301 porque en el 201 hay examen.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-1-0007-4cbf192871dd.mp3'
    tts:
      script: "N: おとこの　がくせいと　おんなの　がくせいが　はなして　います。おとこの　がくせいは　どの　きょうしつへ　いきますか。\nM: 日本語の　じゅぎょうは　にまるいち　きょうしつですか。\nF: きょうは　さんまるいちです。にまるいちは　テストを　して　いますから。\nM: そうですか。ありがとう。\nN: おとこの　がくせいは　どの　きょうしつへ　いきますか。"
      voices: ['narrator', 'man', 'woman']
  - id: n5-lis-1-0008
    stem: 'おとこの　ひとは　あした　なにを　きますか。'
    choices:
      [
        'くろい　シャツと　しろい　ズボン',
        'しろい　シャツと　しろい　ズボン',
        'しろい　シャツと　くろい　ズボン',
        'くろい　シャツと　くろい　ズボン',
      ]
    answer: 4
    explanation:
      en: 'Because of the rain he changes to black trousers too.'
      es: 'Por la lluvia cambia también a pantalón negro.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-1-0008-6fe9991a551e.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。おとこの　ひとは　あした　なにを　きますか。\nF: あしたの　パーティー、なにを　きますか。\nM: くろい　シャツと　しろい　ズボンです。\nF: あしたは　雨ですよ。しろい　ズボンは……。\nM: そうですね。じゃ、ズボンも　くろいのに　します。\nN: おとこの　ひとは　あした　なにを　きますか。"
      voices: ['narrator', 'woman', 'man']
  - id: n5-lis-1-0009
    stem: 'おんなの　ひとは　なにを　のみますか。'
    choices: ['こうちゃ', 'みず', 'コーヒー', 'ジュース']
    answer: 1
    explanation:
      en: 'She asks for tea; the coffee is for the man.'
      es: 'Ella pide té; el café es para él.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-1-0009-91a708bc6d96.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。おんなの　ひとは　なにを　のみますか。\nM: なにを　たべますか。\nF: カレーが　いいです。\nM: ぼくも　カレーに　します。のみものは？\nF: こうちゃを　おねがいします。\nM: じゃ、カレー　ふたつと、こうちゃ　ひとつと、コーヒー　ひとつ　ください。\nN: おんなの　ひとは　なにを　のみますか。"
      voices: ['narrator', 'man', 'woman']
  - id: n5-lis-1-0010
    stem: 'おんなの　ひとは　なんかいへ　いきますか。'
    choices: ['二かい', '五かい', '一かい', '三かい']
    answer: 4
    explanation:
      en: "Children's shoes are on the third floor."
      es: 'Los zapatos de niño están en la tercera planta.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-1-0010-26d52df294dd.mp3'
    tts:
      script: "N: デパートで　おんなの　ひとと　みせの　ひとが　はなして　います。おんなの　ひとは　なんかいへ　いきますか。\nF: すみません、くつは　なんかいですか。\nM: こどもの　くつは　三かい、おとなの　くつは　五かいです。\nF: こどもの　くつを　かいたいです。\nM: じゃ、三かいへ　どうぞ。\nN: おんなの　ひとは　なんかいへ　いきますか。"
      voices: ['narrator', 'woman', 'man']
  - id: n5-lis-1-0011
