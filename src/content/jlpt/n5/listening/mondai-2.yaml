    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-2-0010-880fe857b62b.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。おとこの　ひとは　きのう　なん時間　べんきょうしましたか。\nF: きのうは　よく　べんきょうしましたか。\nM: ええ、ごぜんに　二時間、ごごに　三時間　しました。\nN: おとこの　ひとは　きのう　なん時間　べんきょうしましたか。"
      voices: ['narrator', 'woman', 'man']
  - id: n5-lis-2-0011
    stem: 'おんなの　ひとは　どんな　へやが　いいですか。'
