# N5 · Listening · Mondai 2 — comprehension of key points
# Original questions written for Nihongo No Torii.
level: N5
section: listening
mondai: 2
instruction:
  en: 'Listen to the question first, then the conversation, and choose the best answer.'
  ja: 'はじめに しつもんを きいて ください。それから はなしを きいて、いちばん いい ものを えらんで ください。'
questions:
  - id: n5-lis-2-0001
    stem: 'おんなの　ひとは　きのうの　ごご　なにを　しましたか。'
    choices:
      [
        'うちで　本を　よみました',
        'ともだちと　かいものを　しました',
        'こうえんへ　いきました',
        'そうじを　しました',
      ]
    answer: 1
    explanation:
      en: 'Because of the rain she read at home in the afternoon. Cleaning was in the morning.'
      es: 'Por la lluvia leyó en casa por la tarde. La limpieza fue por la mañana.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-2-0001-3a0b3030ddc2.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。おんなの　ひとは　きのうの　ごご　なにを　しましたか。\nM: きのうは　なにを　しましたか。\nF: あさは　そうじを　しました。ごごは　ともだちと　こうえんへ　いきたかったですが、雨でしたから、うちで　本を　よみました。\nN: おんなの　ひとは　きのうの　ごご　なにを　しましたか。"
      voices: ['narrator', 'man', 'woman']
  - id: n5-lis-2-0002
    stem: 'おとこの　ひとは　どうして　おそく　なりましたか。'
    choices:
      [
        'みちが　わからなかったから',
        'さいふを　わすれたから',
        'あさ　おきられなかったから',
        'でんしゃが　おくれたから',
      ]
    answer: 2
    explanation:
      en: 'He went home for his wallet; the train was fine.'
      es: 'Volvió a casa por la cartera; el tren iba bien.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-2-0002-07a5b61c0bcf.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。おとこの　ひとは　どうして　おそく　なりましたか。\nF: おそかったですね。\nM: すみません。でんしゃは　だいじょうぶでしたが、えきで　さいふが　ありませんでした。それで、うちへ　とりに　かえりました。\nN: おとこの　ひとは　どうして　おそく　なりましたか。"
      voices: ['narrator', 'woman', 'man']
  - id: n5-lis-2-0003
    stem: 'おんなの　ひとの　へやは　なんがいですか。'
    choices: ['三かい', '二かい', '四かい', '五かい']
    answer: 4
    explanation:
      en: 'Her room is on the fifth floor; the second floor was her old room.'
      es: 'Su habitación está en el quinto; el segundo era la de antes.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-2-0003-f32c4080cccb.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。おんなの　ひとの　へやは　なんがいですか。\nM: やまださんの　へやは　なんがいですか。\nF: 五かいです。エレベーターが　ありませんから、たいへんです。まえの　へやは　二かいでした。\nN: おんなの　ひとの　へやは　なんがいですか。"
      voices: ['narrator', 'man', 'woman']
  - id: n5-lis-2-0004
    stem: 'おとこの　ひとは　どの　スポーツが　いちばん　すきですか。'
    choices: ['サッカー', 'テニス', 'やきゅう', 'すいえい']
    answer: 3
    explanation:
      en: 'He likes tennis and football, but baseball most.'
      es: 'Le gustan el tenis y el fútbol, pero sobre todo el béisbol.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-2-0004-89eceed97654.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。おとこの　ひとは　どの　スポーツが　いちばん　すきですか。\nF: どんな　スポーツが　すきですか。\nM: テニスも　サッカーも　すきですが、いちばん　すきなのは　やきゅうです。\nN: おとこの　ひとは　どの　スポーツが　いちばん　すきですか。"
      voices: ['narrator', 'woman', 'man']
  - id: n5-lis-2-0005
    stem: 'いま　なん時ですか。'
    choices: ['三時', '三時十分', '二時五十分', '二時四十分']
    answer: 3
    explanation:
      en: 'Ten minutes before three is 2:50.'
      es: 'Diez minutos antes de las tres son las 2:50.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-2-0005-0544c0ad3a2b.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。いま　なん時ですか。\nM: すみません、いま　なん時ですか。\nF: 三時じゅっぷんまえです。\nM: え、三時じゅっぷんですか。\nF: いいえ、三時の　じゅっぷんまえです。\nN: いま　なん時ですか。"
      voices: ['narrator', 'man', 'woman']
  - id: n5-lis-2-0006
    stem: 'おんなの　ひとは　なん人で　りょこうに　いきますか。'
    choices: ['四人', '五人', '三人', '二人']
    answer: 1
    explanation:
      en: 'Father, mother, sister and herself: four. Her brother cannot go.'
      es: 'Padre, madre, hermana y ella: cuatro. Su hermano no puede ir.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-2-0006-5b725493cf74.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。おんなの　ひとは　なん人で　りょこうに　いきますか。\nM: なつやすみに　りょこうに　いきますか。\nF: はい、かぞくと　いきます。ちちと　ははと　あねと　わたしです。あにも　いきたかったですが、しごとが　ありますから。\nN: おんなの　ひとは　なん人で　りょこうに　いきますか。"
      voices: ['narrator', 'man', 'woman']
  - id: n5-lis-2-0007
    stem: 'おとこの　ひとは　いま　なにで　かいしゃへ　きますか。'
    choices: ['バス', 'でんしゃ', 'くるま', 'じてんしゃ']
    answer: 4
    explanation:
      en: 'He used to take the train; now he cycles.'
      es: 'Antes iba en tren; ahora va en bici.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-2-0007-bb9328907723.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。おとこの　ひとは　いま　なにで　かいしゃへ　きますか。\nF: まいにち　でんしゃで　きますか。\nM: まえは　でんしゃでしたが、いまは　じてんしゃです。からだに　いいですから。\nN: おとこの　ひとは　いま　なにで　かいしゃへ　きますか。"
      voices: ['narrator', 'woman', 'man']
  - id: n5-lis-2-0008
    stem: 'おんなの　ひとは　どうして　日本語を　べんきょうして　いますか。'
    choices:
      [
        '日本で　はたらきたいから',
        '日本の　だいがくで　べんきょうしたいから',
        'ともだちが　日本人だから',
        'アニメが　すきだから',
      ]
    answer: 2
    explanation:
      en: 'The main reason is studying at a Japanese university; anime is secondary.'
      es: 'El motivo principal es estudiar en una universidad japonesa; el anime es secundario.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-2-0008-090b02384868.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。おんなの　ひとは　どうして　日本語を　べんきょうして　いますか。\nM: どうして　日本語を　べんきょうして　いますか。\nF: アニメも　すきですが、らいねん　日本の　だいがくで　べんきょうしたいからです。\nN: おんなの　ひとは　どうして　日本語を　べんきょうして　いますか。"
      voices: ['narrator', 'man', 'woman']
  - id: n5-lis-2-0009
    stem: 'こうえんは　どこに　ありますか。'
    choices:
      [
        'ゆうびんきょくの　まえ',
        'ぎんこうの　となり',
        'ぎんこうの　まえ',
        'ゆうびんきょくの　となり',
      ]
    answer: 2
    explanation:
      en: 'The park is next to the bank.'
      es: 'El parque está al lado del banco.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n5-lis-2-0009-501f1a5b133f.mp3'
    tts:
      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。こうえんは　どこに　ありますか。\nM: この　ちかくに　こうえんが　ありますか。\nF: ええ、ぎんこうの　となりに　あります。\nM: ぎんこうは　ゆうびんきょくの　まえですね。\nF: いいえ、ぎんこうは　ゆうびんきょくの　うしろです。\nN: こうえんは　どこに　ありますか。"
      voices: ['narrator', 'man', 'woman']
  - id: n5-lis-2-0010
    stem: 'おとこの　ひとは　きのう　なん時間　べんきょうしましたか。'
    choices: ['六時間', '三時間', '二時間', '五時間']
    answer: 4
    explanation:
      en: 'Two hours plus three hours is five.'
      es: 'Dos horas más tres son cinco.'
