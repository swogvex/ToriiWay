      script: "N: おとこの　ひとと　おんなの　ひとが　はなして　います。おんなの　ひとは　どんな　へやが　いいですか。\nM: どんな　へやを　さがして　いますか。\nF: ちいさくても　いいです。でも、えきから　ちかい　へやが　いいです。\nN: おんなの　ひとは　どんな　へやが　いいですか。"
