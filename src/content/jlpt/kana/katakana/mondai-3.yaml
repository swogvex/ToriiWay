# Kana · Katakana & numbers · Mondai 3 — numbers
# Original questions written for ToriiWay.
level: kana
section: katakana
mondai: 3
instruction:
  en: 'Choose the reading of the number.'
  ja: 'すうじの　よみかたを　えらんで　ください。'
questions:
  - id: kana-kata-3-0001
    stem: '300'
    choices: ['さんぴゃく', 'さんひゃく', 'さんびゃく', 'さんはく']
    answer: 3
    explanation:
      en: '300 is read さんびゃく. After 3, ひゃく becomes びゃく.'
      es: '300 se lee さんびゃく. Tras 3, ひゃく pasa a びゃく.'
    author: claude
  - id: kana-kata-3-0002
    stem: '600'
    choices: ['ろっぴゃく', 'ろくひゃく', 'ろくぴゃく', 'ろっひゃく']
    answer: 1
    explanation:
      en: '600 is read ろっぴゃく. 6 + 100 shortens to ろっぴゃく.'
      es: '600 se lee ろっぴゃく. 6 + 100 se acorta en ろっぴゃく.'
    author: claude
  - id: kana-kata-3-0003
    stem: '800'
    choices: ['はちひゃく', 'はっひゃく', 'はちびゃく', 'はっぴゃく']
    answer: 4
    explanation:
      en: '800 is read はっぴゃく. 8 + 100 shortens to はっぴゃく.'
      es: '800 se lee はっぴゃく. 8 + 100 se acorta en はっぴゃく.'
    author: claude
  - id: kana-kata-3-0004
    stem: '3000'
    choices: ['みせん', 'さんぜん', 'さんせん', 'さんぜえん']
    answer: 2
    explanation:
      en: '3000 is read さんぜん. After 3, せん becomes ぜん.'
      es: '3000 se lee さんぜん. Tras 3, せん pasa a ぜん.'
    author: claude
  - id: kana-kata-3-0005
    stem: '8000'
    choices: ['はちぜん', 'はっせん', 'はっぜん', 'はつせん']
    answer: 2
    explanation:
      en: '8000 is read はっせん. 8 + 1000 shortens to はっせん.'
      es: '8000 se lee はっせん. 8 + 1000 se acorta en はっせん.'
    author: claude
  - id: kana-kata-3-0006
    stem: '4時'
    choices: ['よっじ', 'よんじ', 'しじ', 'よじ']
    answer: 4
    explanation:
      en: "4時 is read よじ. 4 o'clock is よじ."
      es: '4時 se lee よじ. Las 4 en punto es よじ.'
    author: claude
  - id: kana-kata-3-0007
    stem: '9時'
    choices: ['くうじ', 'きゅうじ', 'くじ', 'きゅじ']
    answer: 3
    explanation:
      en: "9時 is read くじ. 9 o'clock is くじ."
      es: '9時 se lee くじ. Las 9 en punto es くじ.'
