  - id: kana-kata-3-0008
    stem: '4月1日'
    choices: ['しがつ　ついたち', 'しがつ　いちにち', 'よんがつ　いちにち', 'よんがつ　ついたち']
    answer: 1
    explanation:
      en: '4月1日 is read しがつ　ついたち. April is しがつ; the 1st of the month is ついたち.'
      es: '4月1日 se lee しがつ　ついたち. Abril es しがつ; el día 1 es ついたち.'
    author: claude
  - id: kana-kata-3-0009
    stem: '5月20日'
