  - id: kana-kata-3-0015
    stem: '100円'
    choices: ['いちひゃくえん', 'びゃくえん', 'ひゃっえん', 'ひゃくえん']
    answer: 4
    explanation:
      en: '100円 is read ひゃくえん. 100 is just ひゃく, without いち.'
      es: '100円 se lee ひゃくえん. 100 es solo ひゃく, sin いち.'
