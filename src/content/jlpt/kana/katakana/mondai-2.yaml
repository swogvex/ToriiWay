    choices: ['ン', 'シ', 'ソ', 'ツ']
    answer: 2
    explanation:
      en: '"shi" is written シ. The others: ツ (tsu), ン (n), ソ (so).'
      es: '"shi" se escribe シ. Las otras: ツ (tsu), ン (n), ソ (so).'
    author: claude
