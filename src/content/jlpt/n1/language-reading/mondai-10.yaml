# N1 · Language knowledge · Reading · Mondai 10 — long passages
# Original questions written for ToriiWay.
level: N1
section: language-reading
mondai: 10
instruction:
  en: 'Read the text and answer the questions.'
  ja: 'つぎの 文章を 読んで、後の 問いに 対する 答えとして 最も よい ものを えらんで ください。'
passages:
  - id: ai
    text: "　文章を自動で作る技術が急速に進歩している。簡単な指示を与えるだけで、報告書やあいさつ文が一瞬で出来上がる。文章を書くのが苦手な人にとっては、まさに夢のような道具だろう。実際、わたしの周りでも、仕事のメールの下書きをこうした道具に任せる人が増えてきた。\n　しかし、わたしはこの流れに一抹の不安を覚える。文章を書くという行為は、単に情報を並べることではないからだ。何を書くかを決め、どう並べれば伝わるかを考え、ふさわしい言葉を探す。この過程で、わたしたちは自分が本当は何を考えていたのかに初めて気づく。書く前には漠然としていた考えが、書くことによって形を与えられるのである。\n　もし書く作業をすべて機械に任せてしまえば、出来上がった文章はたしかに整っているだろう。だが、それはわたしたちの考えを表したものではなく、どこかで見たことのある、もっともらしい言葉の集まりにすぎない。そして何より、考えを形にする機会そのものが失われてしまう。\n　とはいえ、新しい技術を拒めばよいというわけでもない。かつて電卓が登場したとき、計算力が落ちると心配した人は多かった。だが、電卓のおかげで、人は面倒な計算から解放され、より本質的な問題を考える時間を得た。文章を作る技術も、使い方次第では、わたしたちの考えを深める助けになるはずだ。たとえば、自分で書いた文章を読ませて意見を求めれば、自分では気づかなかった論理の弱さが見えてくることもある。\n　要は、何を機械に任せ、何を自分の手に残すかである。考えること、つまり書くことの中心にある部分だけは、手放してはならないと思う。"
  - id: trees
    text: "　夏の日差しが強い日、街路樹の陰に入ると、ほっと一息つける。木々は単に街を美しく見せるだけでなく、気温の上昇を抑え、雨水をため、鳥や虫のすみかにもなる。都市にとって、緑はなくてはならない存在だ。\n　ところが近年、各地で街路樹を大幅に切る動きが目立っている。落ち葉の掃除が大変だ、枝が信号や看板を隠す、根が歩道を持ち上げる、といった苦情が寄せられるからだ。管理にかかる費用を減らしたいという自治体の事情もある。苦情を受けて枝を短く切りそろえた結果、葉がほとんどなくなり、夏に日陰を作れなくなった木も少なくない。\n　確かに、苦情を寄せる住民の困り事は理解できる。毎朝の落ち葉掃除は、高齢の住民には重い負担だろう。だが、木を切れば問題が解決するかといえば、そう単純ではない。一度大きく育った木を失えば、元の姿に戻るまでに何十年もかかる。その間、街は暑さに対して無防備になる。\n　ある市では、木の管理を行政だけに任せるのではなく、住民が参加する仕組みを作った。近所の人々が当番を決めて落ち葉を集め、集めた葉は公園の花壇の肥料として使う。どの木を残し、どう手入れするかも、住民と専門家が一緒に話し合って決めるという。自分たちで世話をするようになると、木への苦情は目に見えて減ったそうだ。\n　街の緑は、だれかが与えてくれるものではない。そこに住む人々が、その恵みと手間の両方を引き受けてこそ、守られていくものなのだろう。"
  - id: museum
    text: "　博物館というと、珍しい物や貴重な物を並べて見せる場所を思い浮かべる人が多いだろう。だが、展示は博物館の仕事のほんの一部にすぎない。来館者の目に触れない収蔵庫には、展示されている物の何十倍もの資料が眠っている。\n　博物館の最も基本的な役割は、資料を集め、それを将来に残すことである。今は価値がないように見える物でも、百年後には時代を知る貴重な手がかりになるかもしれない。たとえば、ありふれた日用品や広告のちらしは、当時の人々の暮らしをありありと伝えてくれる。何が後世にとって重要になるかは、今の時点ではだれにもわからない。だからこそ、博物館は目先の人気にとらわれず、幅広く資料を集め続ける必要がある。\n　ところが、こうした地道な仕事は、なかなか評価されにくい。予算を決める立場の人々は、来館者の数で博物館の価値を測りがちだ。その結果、話題を集める特別展にばかり力が注がれ、資料の整理や保存にかける人手や予算が削られている館も少なくない。\n　来館者を増やす努力が無意味だとは思わない。多くの人に足を運んでもらうことは、博物館の存在意義を社会に示すうえで大切だ。しかし、それはあくまで、資料を守り伝えるという土台の上に成り立つものである。土台が崩れてしまえば、いくら華やかな展示を行っても、博物館は単なる見せ物小屋になってしまう。\n　博物館の価値は、今日の来館者数だけでなく、百年後の人々に何を手渡せるかによっても測られるべきなのだ。"
questions:
  - id: n1-lr-10-0001
    passage: ai
    stem: '筆者に　よると、書く　ことに　よって　何が　起こるか。'
    choices:
      - '文章が　整って　見える'
      - '情報を　速く　集められる'
      - '苦手な　ことが　得意に　なる'
      - 'ぼんやり　して　いた　考えが　はっきり　する'
    answer: 4
    explanation:
      en: 'Writing gives shape to vague thoughts.'
      es: 'Escribir da forma a ideas vagas.'
    author: claude
  - id: n1-lr-10-0002
    passage: ai
    stem: '筆者は、書く　作業を　すべて　機械に　任せた　文章を　どう　評価して　いるか。'
    choices:
      - '整っては　いるが、自分の　考えでは　ない'
      - '間違いが　多くて　使えない'
      - '読む　人に　誤解を　与える'
      - '人が　書いた　ものより　読みにくい'
    answer: 1
    explanation:
      en: 'Neat, but only plausible words, not our own thinking.'
      es: 'Ordenado, pero solo palabras verosímiles, no nuestras ideas.'
    author: claude
  - id: n1-lr-10-0003
    passage: ai
    stem: '電卓の　例は　何を　説明する　ために　挙げられて　いるか。'
    choices:
      - '昔の　人は　新しい　技術を　嫌った　こと'
      - '技術が　進むと　人の　能力が　落ちる　こと'
      - '新しい　技術は　使い方に　よって　役に　立つ　こと'
      - '計算は　機械に　任せるべきでは　ない　こと'
    answer: 3
    explanation:
      en: 'Calculators freed time for deeper problems.'
      es: 'La calculadora liberó tiempo para problemas de fondo.'
    author: claude
  - id: n1-lr-10-0004
    passage: ai
    stem: '筆者の　考えに　最も　近いのは　どれか。'
    choices:
      - '文章を　作る　技術は　使うべきでは　ない'
      - '考える　部分は　自分で　行い、機械は　助けと　して　使うべきだ'
      - '機械が　書いた　文章は　読むべきでは　ない'
      - '書く　作業は　すべて　機械に　任せた　ほうが　よい'
    answer: 2
    explanation:
      en: 'Keep the thinking; let the machine help.'
      es: 'Quedarse con el pensar; que la máquina ayude.'
    author: claude
  - id: n1-lr-10-0005
    passage: trees
    stem: '街路樹が　切られる　理由と　して　挙げられて　いないのは　どれか。'
    choices:
      - '木が　病気に　なりやすい　こと'
      - '落ち葉の　掃除が　大変な　こと'
      - '枝が　信号を　隠す　こと'
      - '管理の　費用を　減らしたい　こと'
    answer: 1
    explanation:
      en: 'Disease is never mentioned; the other three are.'
      es: 'Las enfermedades no se mencionan; las otras tres sí.'
    author: claude
  - id: n1-lr-10-0006
    passage: trees
    stem: '「そう　単純では　ない」と　筆者が　考えるのは　なぜか。'
    choices:
      - '落ち葉の　掃除が　さらに　大変に　なるから'
      - '住民の　苦情が　なくならないから'
      - '木が　元に　戻るまで　長い　時間が　かかるから'
      - '費用が　もっと　かかるから'
    answer: 3
    explanation:
      en: 'A big tree takes decades to grow back.'
      es: 'Un árbol grande tarda décadas en recuperarse.'
    author: claude
  - id: n1-lr-10-0007
    passage: trees
    stem: 'ある　市の　取り組みで　どんな　変化が　あったか。'
    choices:
      - '公園の　花壇が　なくなった'
      - '木への　苦情が　減った'
      - '管理の　費用が　増えた'
      - '街路樹の　数が　増えた'
    answer: 2
    explanation:
      en: 'Once residents cared for the trees, complaints fell.'
      es: 'Al cuidarlos los vecinos, las quejas bajaron.'
    author: claude
  - id: n1-lr-10-0008
    passage: trees
    stem: '筆者が　最も　言いたい　ことは　何か。'
    choices:
      - '木の　管理は　専門家に　任せるべきだ'
      - '街路樹は　すべて　残すべきだ'
      - '苦情を　言う　住民が　悪い'
      - '街の　緑は　住民が　関わる　ことで　守られる'
    answer: 4
    explanation:
      en: 'Residents must take on both the benefits and the work.'
      es: 'Los vecinos deben asumir el beneficio y el trabajo.'
    author: claude
  - id: n1-lr-10-0009
    passage: museum
    stem: '筆者に　よると、博物館の　最も　基本的な　役割は　何か。'
    choices:
      - '来館者を　増やす　こと'
      - '特別展を　開く　こと'
      - '資料を　集めて　将来に　残す　こと'
      - '珍しい　物を　展示する　こと'
    answer: 3
    explanation:
      en: 'Collecting and preserving for the future.'
      es: 'Reunir y conservar para el futuro.'
    author: claude
  - id: n1-lr-10-0010
    passage: museum
    stem: '日用品や　ちらしの　例は　何を　示す　ために　挙げられて　いるか。'
    choices:
      - '昔の　広告は　今より　すぐれて　いた　こと'
      - '博物館には　古い　物が　多すぎる　こと'
      - '日用品は　展示に　向いて　いない　こと'
      - '今は　価値が　なくても　後に　重要に　なる　物が　ある　こと'
    answer: 4
    explanation:
      en: 'Ordinary things become precious records later.'
      es: 'Lo cotidiano se vuelve un registro valioso con el tiempo.'
    author: claude
  - id: n1-lr-10-0011
    passage: museum
    stem: '筆者は、来館者を　増やす　努力に　ついて　どう　考えて　いるか。'
    choices:
      - '大切だが、資料を　守る　ことが　前提だ'
      - '予算を　増やす　ために　必要だ'
      - '博物館の　最も　大切な　仕事だ'
      - '意味が　ないので　やめるべきだ'
    answer: 1
    explanation:
      en: 'Worthwhile, but built on preserving the collection.'
      es: 'Valioso, pero sobre la base de conservar los fondos.'
    author: claude
  - id: n1-lr-10-0012
    passage: museum
    stem: '筆者の　考えに　合うのは　どれか。'
    choices:
      - '特別展は　やめるべきだ'
      - '博物館の　価値は　将来への　貢献でも　測るべきだ'
      - '収蔵庫の　資料を　すべて　展示すべきだ'
      - '博物館の　価値は　来館者数で　決まる'
    answer: 2
    explanation:
      en: 'Value also lies in what is handed to people a century on.'
      es: 'El valor también está en lo que se deja a quien venga en cien años.'
    author: claude
