      - 'つまり'
      - 'だから'
    answer: 1
    explanation:
      en: 'After the drawbacks, a turn: しかし.'
      es: 'Tras los inconvenientes, un giro: しかし.'
    author: claude
  - id: n1-lr-7-0015
    passage: letters
    stem: '（５）'
    choices:
      - '手'
      - '腕'
      - '心'
      - '顔'
    answer: 3
    explanation:
      en: '手間を 惜しまない 心: a spirit that spares no effort.'
      es: '手間を 惜しまない 心: una actitud que no escatima esfuerzos.'
    author: claude
