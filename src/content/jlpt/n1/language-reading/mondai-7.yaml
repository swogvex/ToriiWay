  - id: n1-lr-7-0009
    passage: night
    stem: '（４）'
    choices:
      - 'あった'
      - 'あるまい'
      - 'ない'
      - 'ある'
    answer: 4
    explanation:
      en: 'でも ある: it is also (a choice to protect workers).'
      es: 'でも ある: también es (una forma de proteger a quien trabaja).'
    author: claude
  - id: n1-lr-7-0010
    passage: night
    stem: '（５）'
    choices:
      - '馳せる'
      - '込める'
      - '遂げる'
      - '晴らす'
    answer: 1
    explanation:
      en: '思いを 馳せる: to think of someone far away.'
      es: '思いを 馳せる: pensar en alguien.'
    author: claude
  - id: n1-lr-7-0011
    passage: letters
    stem: '（１）'
    choices:
      - 'すると'
      - '要するに'
      - 'それでも'
      - 'そのため'
    answer: 3
    explanation:
      en: 'Despite email being better, the writer still writes by hand.'
      es: 'Aunque el correo es mejor, sigue escribiendo a mano.'
    author: claude
  - id: n1-lr-7-0012
    passage: letters
    stem: '（２）'
    choices:
      - 'うかがわせる'
      - 'うかがえる'
      - 'うかがって　いる'
      - 'うかがう'
    answer: 2
    explanation:
      en: '〜が うかがえる: can be sensed.'
      es: '〜が うかがえる: se percibe.'
    author: claude
  - id: n1-lr-7-0013
    passage: letters
    stem: '（３）'
    choices:
      - 'やすい'
      - 'がちだ'
      - 'っぽい'
      - 'にくい'
    answer: 4
    explanation:
      en: 'Typed text does not carry this well: 伝わりにくい.'
      es: 'El texto en pantalla no lo transmite bien: 伝わりにくい.'
