# N1 · Language knowledge · Reading · Mondai 6 — sentence composition
# Original questions written for ToriiWay.
level: N1
section: language-reading
mondai: 6
instruction:
  en: 'Put the four parts in order. Which part goes in ★?'
  ja: 'つぎの 文の ★ に 入る 最も よい ものを えらんで ください。'
questions:
  - id: n1-lr-6-0001
    stem: '彼は　＿＿＿　＿＿＿　★　＿＿＿　出場した。'
    choices:
      - 'けがを'
      - 'ものともせず'
      - '足の'
      - '決勝に'
    answer: 2
    explanation:
      en: '足の けがを ものともせず 決勝に 出場した.'
      es: '足の けがを ものともせず 決勝に 出場した: "Salió a la final pese a la lesión."'
    author: claude
  - id: n1-lr-6-0002
    stem: 'この　店の　＿＿＿　★　＿＿＿　＿＿＿　味だ。'
    choices:
      - 'ならではの'
      - '料理は'
      - '深い'
      - '老舗'
    answer: 4
    explanation:
      en: 'この店の 料理は 老舗 ならではの 深い 味だ.'
      es: 'この店の 料理は 老舗 ならではの 深い 味だ: "Un sabor profundo propio de una casa con solera."'
    author: claude
  - id: n1-lr-6-0003
