# N1 · Language knowledge · Reading · Mondai 3 — paraphrase
# Original questions written for ToriiWay.
level: N1
section: language-reading
mondai: 3
instruction:
  en: 'Choose the answer closest in meaning to the underlined part.'
  ja: '＿＿＿の 言葉に 意味が 最も 近い ものを えらんで ください。'
questions:
  - id: n1-lr-3-0001
    stem: '彼の　話は　__つじつまが　合わない__。'
    choices:
      - '筋が　通らない'
      - '時間が　長い'
      - '声が　小さい'
      - '内容が　古い'
    answer: 1
    explanation:
      en: 'つじつまが 合わない: it does not add up.'
      es: 'つじつまが 合わない: no tiene lógica.'
    author: claude
  - id: n1-lr-3-0002
    stem: '準備は　__おおむね__　終わった。'
    choices:
      - 'すっかり'
      - 'だいたい'
      - 'ようやく'
      - 'わずかに'
    answer: 2
    explanation:
      en: 'おおむね: mostly.'
      es: 'おおむね: en su mayor parte.'
    author: claude
  - id: n1-lr-3-0003
    stem: '彼は　__ひたすら__　練習を　続けた。'
    choices:
      - '仕方なく'
      - 'ときどき'
      - 'ただ　それだけを'
      - '友人と'
    answer: 3
    explanation:
