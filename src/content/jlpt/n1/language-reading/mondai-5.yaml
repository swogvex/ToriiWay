level: N1
section: language-reading
mondai: 5
instruction:
  en: 'Choose the best answer for the blank (　).'
  ja: 'つぎの 文の （　）に 入れるのに 最も よい ものを えらんで ください。'
questions:
  - id: n1-lr-5-0001
    stem: '彼は　足の　けが　（　）、決勝に　出場した。'
