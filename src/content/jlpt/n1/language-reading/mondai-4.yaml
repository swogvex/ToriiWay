      - '長く　なった　髪を　手分けして　結んだ。'
      - '一人で　手分けして　全部　終わらせた。'
    answer: 2
    explanation:
      en: '手分けする: to divide the work among people.'
      es: '手分けする: repartirse el trabajo.'
    author: claude
