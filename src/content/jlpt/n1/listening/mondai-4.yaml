    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n1-lis-4-0011-37fb3d4e69a1.mp3'
    tts:
      script: "M: 彼の　話、どうも　腑に　落ちないんだよね。\nF: 1　お腹が　痛いの？\nF: 2　わたしも、何か　隠してる　気が　する\nF: 3　うん、とても　納得できたね"
