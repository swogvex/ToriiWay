# N1 · Listening · Mondai 4 — quick response
# Original questions written for ToriiWay.
level: N1
section: listening
mondai: 4
instruction:
  en: 'Listen to the sentence and the three replies. Choose the best reply.'
  ja: '文を 聞いて、１から３の 中から、最も よい 返事を えらんで ください。'
questions:
  - id: n1-lis-4-0001
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'そうだね、早めに　自分から　報告しよう'
      - 'ただなら　ありがたいね'
      - 'うん、部長は　耳が　いいからね'
    answer: 1
    explanation:
      en: 'ただでは 済まない: there will be trouble.'
      es: 'ただでは 済まない: habrá problemas.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n1-lis-4-0001-7f31ff14b39a.mp3'
    tts:
      script: "M: あの　件、部長の　耳に　入ったら　ただでは　済まないよ。\nF: 1　そうだね、早めに　自分から　報告しよう\nF: 2　ただなら　ありがたいね\nF: 3　うん、部長は　耳が　いいからね"
      voices: ['man', 'woman']
  - id: n1-lis-4-0002
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'え、不正解だったの？'
      - '任せなければ　よかったね'
      - 'うん、期待以上の　出来だったよ'
    answer: 3
    explanation:
      en: 'Agreeing it went well.'
      es: 'Coincidir en que salió bien.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n1-lis-4-0002-b96d7a539b01.mp3'
    tts:
      script: "F: 今回の　企画、彼に　任せて　正解だったね。\nM: 1　え、不正解だったの？\nM: 2　任せなければ　よかったね\nM: 3　うん、期待以上の　出来だったよ"
      voices: ['man', 'woman']
  - id: n1-lis-4-0003
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'では、部長に　外出して　いただけますか'
      - 'そうですか。では、また　改めて　伺います'
      - 'それは　よかったです'
    answer: 2
    explanation:
      en: 'The manager is out: come back another time.'
      es: 'El jefe no está: volver otro día.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n1-lis-4-0003-14c336d0d2d6.mp3'
    tts:
      script: "M: せっかく　来て　いただいたのに、あいにく　部長は　外出して　おりまして。\nF: 1　では、部長に　外出して　いただけますか\nF: 2　そうですか。では、また　改めて　伺います\nF: 3　それは　よかったです"
      voices: ['man', 'woman']
  - id: n1-lis-4-0004
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'そうですね。データを　もう一度　見直します'
      - 'もう　ぎりぎりまで　あけました'
      - 'はい、箱に　詰めて　おきます'
    answer: 1
    explanation:
      en: '詰める: to refine, work out details.'
      es: '詰める: pulir, concretar.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n1-lis-4-0004-7b0a614fe5fb.mp3'
    tts:
      script: "F: この　報告書、もう少し　詰めた　ほうが　いいんじゃない？\nM: 1　そうですね。データを　もう一度　見直します\nM: 2　もう　ぎりぎりまで　あけました\nM: 3　はい、箱に　詰めて　おきます"
      voices: ['man', 'woman']
  - id: n1-lis-4-0005
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'うん、すごく　頑張ってるね'
      - '何か　悩みでも　あるのかな'
      - '体重が　減ったのかな'
    answer: 2
    explanation:
      en: '身が 入らない: cannot focus.'
      es: '身が 入らない: no concentrarse.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n1-lis-4-0005-cb65eaec2d69.mp3'
    tts:
      script: "M: 田中さん、最近　仕事に　身が　入って　ないみたいだね。\nF: 1　うん、すごく　頑張ってるね\nF: 2　何か　悩みでも　あるのかな\nF: 3　体重が　減ったのかな"
      voices: ['man', 'woman']
  - id: n1-lis-4-0006
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'いえ、時間は　差し上げられません'
      - 'はい、恐れて　います'
      - 'ええ、何でしょうか'
    answer: 3
    explanation:
      en: 'A polite request for a moment.'
      es: 'Una petición cortés de un momento.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n1-lis-4-0006-ab834b1d9534.mp3'
    tts:
      script: "F: お忙しい　ところ　恐れ入りますが、少々　お時間を　いただけますか。\nM: 1　いえ、時間は　差し上げられません\nM: 2　はい、恐れて　います\nM: 3　ええ、何でしょうか"
      voices: ['man', 'woman']
  - id: n1-lis-4-0007
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'じゃあ、もっと　練習すれば　よかったね'
      - '悔しくて　たまらないね'
      - 'うん、やれる　ことは　全部　やったもんね'
    answer: 3
    explanation:
      en: 'No regrets after all that practice.'
      es: 'Sin remordimientos tras tanto entrenar.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n1-lis-4-0007-b8c8250c594c.mp3'
    tts:
      script: "M: あれだけ　練習したんだから、負けても　悔いは　ないよ。\nF: 1　じゃあ、もっと　練習すれば　よかったね\nF: 2　悔しくて　たまらないね\nF: 3　うん、やれる　ことは　全部　やったもんね"
      voices: ['man', 'woman']
  - id: n1-lis-4-0008
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'うん、山田さんは　来なかったね'
      - '本当、だれも　口を　挟めなかったね'
      - 'みんなで　協力して　よかったね'
