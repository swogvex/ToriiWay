    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n1-lis-4-0009-995f7d1d0835.mp3'
    tts:
      script: "M: そんな　こと、今さら　言われても　困るよ。\nF: 1　ごめん、もっと　早く　言うべきだったね\nF: 2　じゃあ、あとで　言うね\nF: 3　今　言って　よかった"
      voices: ['man', 'woman']
  - id: n1-lis-4-0010
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
