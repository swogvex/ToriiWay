    explanation:
      en: '独壇場: a one-person show.'
      es: '独壇場: un espectáculo de una sola persona.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n1-lis-4-0008-0823efb80d5a.mp3'
    tts:
      script: "F: 今日の　プレゼン、山田さんの　独壇場だったね。\nM: 1　うん、山田さんは　来なかったね\nM: 2　本当、だれも　口を　挟めなかったね\nM: 3　みんなで　協力して　よかったね"
      voices: ['man', 'woman']
  - id: n1-lis-4-0009
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'ごめん、もっと　早く　言うべきだったね'
      - 'じゃあ、あとで　言うね'
      - '今　言って　よかった'
