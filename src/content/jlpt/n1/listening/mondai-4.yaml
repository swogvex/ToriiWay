    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n1-lis-4-0014-4427ae1df543.mp3'
    tts:
      script: "F: すみません、お先に　失礼します。\nM: 1　お疲れさまでした\nM: 2　いえ、失礼じゃないですよ\nM: 3　どうぞ、お先に　召し上がって"
