    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n1-lis-4-0010-19de2b975447.mp3'
    tts:
      script: "F: 今度の　旅行、雨に　降られなければ　いいけど。\nM: 1　雨で　よかったね\nM: 2　うん、雨に　降らせよう\nM: 3　天気予報では　晴れるって　言ってたよ"
      voices: ['man', 'woman']
  - id: n1-lis-4-0011
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
