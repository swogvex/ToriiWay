# N4 · Listening · Mondai 3 — utterance expressions
# Original questions written for ToriiWay.
level: N4
section: listening
mondai: 3
instruction:
  en: 'Read the situation and listen. What do you say? Choose 1, 2 or 3.'
  ja: '文を 読んで、聞いて ください。なんと 言いますか。１から３の 中から、いちばん いい ものを えらんで ください。'
questions:
  - id: n4-lis-3-0001
    stem: '友だちの　家で、もっと　ケーキを　食べたいです。なんと　言いますか。'
    choices:
      - 'もう　少し　食べましょうか'
      - 'もう　少し　めしあがって　ください'
      - 'もう　少し　いただいても　いいですか'
    answer: 3
    explanation:
      en: 'いただく is the humble "eat"; asking permission fits.'
      es: 'いただく es el humilde "comer"; pedir permiso es lo adecuado.'
    author: claude
    tts:
      script: "N: 友だちの　家で、もっと　ケーキを　食べたいです。なんと　言いますか。\nN: 1　もう　少し　食べましょうか\nN: 2　もう　少し　めしあがって　ください\nN: 3　もう　少し　いただいても　いいですか"
      voices: ['narrator']
  - id: n4-lis-3-0002
    stem: '先生の　話が　よく　聞こえません。なんと　言いますか。'
    choices:
      - 'すみません、もう　少し　大きい　声で　お願いします'
      - 'すみません、もう　少し　小さい　声で　お願いします'
      - 'すみません、よく　聞いて　ください'
    answer: 1
    explanation:
      en: 'You cannot hear, so you ask for a louder voice.'
      es: 'No oyes bien, así que pides que hable más alto.'
    author: claude
    tts:
      script: "N: 先生の　話が　よく　聞こえません。なんと　言いますか。\nN: 1　すみません、もう　少し　大きい　声で　お願いします\nN: 2　すみません、もう　少し　小さい　声で　お願いします\nN: 3　すみません、よく　聞いて　ください"
      voices: ['narrator']
  - id: n4-lis-3-0003
    stem: '店で　この　シャツを　着て　みたいです。なんと　言いますか。'
    choices:
      - 'これ、着て　ください'
      - 'これ、着て　みても　いいですか'
      - 'これ、着て　みましょうか'
    answer: 2
    explanation:
      en: '〜て みても いいですか asks to try something on.'
      es: '〜て みても いいですか pide probarse algo.'
    author: claude
    tts:
      script: "N: 店で　この　シャツを　着て　みたいです。なんと　言いますか。\nN: 1　これ、着て　ください\nN: 2　これ、着て　みても　いいですか\nN: 3　これ、着て　みましょうか"
      voices: ['narrator']
  - id: n4-lis-3-0004
    stem: '会社に　おくれそうです。電話で　なんと　言いますか。'
    choices:
      - 'すみません、早く　来て　ください'
      - 'すみません、もう　着きました'
      - 'すみません、少し　おくれます'
    answer: 3
    explanation:
      en: 'You warn that you will be a little late.'
      es: 'Avisas de que llegarás un poco tarde.'
    author: claude
    tts:
      script: "N: 会社に　おくれそうです。電話で　なんと　言いますか。\nN: 1　すみません、早く　来て　ください\nN: 2　すみません、もう　着きました\nN: 3　すみません、少し　おくれます"
      voices: ['narrator']
  - id: n4-lis-3-0005
    stem: '友だちが　重い　にもつを　持って　います。なんと　言いますか。'
    choices:
      - '一つ　持ちましょうか'
      - '一つ　持って　くれませんか'
      - '一つ　持って　いますか'
    answer: 1
    explanation:
      en: '〜ましょうか offers help.'
      es: '〜ましょうか ofrece ayuda.'
    author: claude
    tts:
      script: "N: 友だちが　重い　にもつを　持って　います。なんと　言いますか。\nN: 1　一つ　持ちましょうか\nN: 2　一つ　持って　くれませんか\nN: 3　一つ　持って　いますか"
      voices: ['narrator']
  - id: n4-lis-3-0006
    stem: '先生に　作文を　見て　もらいたいです。なんと　言いますか。'
    choices:
      - '先生、この　作文を　見せて　あげましょうか'
      - '先生、この　作文を　見て　いただけませんか'
      - '先生、この　作文を　見ても　いいですか'
    answer: 2
    explanation:
      en: '〜て いただけませんか politely asks a favour.'
      es: '〜て いただけませんか pide un favor con cortesía.'
    author: claude
    tts:
      script: "N: 先生に　作文を　見て　もらいたいです。なんと　言いますか。\nN: 1　先生、この　作文を　見せて　あげましょうか\nN: 2　先生、この　作文を　見て　いただけませんか\nN: 3　先生、この　作文を　見ても　いいですか"
      voices: ['narrator']
  - id: n4-lis-3-0007
    stem: '道で　人に　ぶつかりました。なんと　言いますか。'
    choices:
      - 'いいえ、どういたしまして'
      - 'おかげさまで'
      - 'あ、すみません'
    answer: 3
    explanation:
      en: 'You apologise when you bump into someone.'
      es: 'Al chocar con alguien se pide perdón.'
    author: claude
    tts:
      script: "N: 道で　人に　ぶつかりました。なんと　言いますか。\nN: 1　いいえ、どういたしまして\nN: 2　おかげさまで\nN: 3　あ、すみません"
      voices: ['narrator']
  - id: n4-lis-3-0008
    stem: '友だちが　しけんに　ごうかくしました。なんと　言いますか。'
    choices:
      - 'おめでとう'
      - 'おつかれさま'
      - 'おだいじに'
    answer: 1
    explanation:
      en: 'おめでとう congratulates.'
      es: 'おめでとう sirve para felicitar.'
    author: claude
    tts:
      script: "N: 友だちが　しけんに　ごうかくしました。なんと　言いますか。\nN: 1　おめでとう\nN: 2　おつかれさま\nN: 3　おだいじに"
      voices: ['narrator']
  - id: n4-lis-3-0009
    stem: 'かぜを　ひいた　友だちと　わかれます。なんと　言いますか。'
    choices:
      - 'いただきます'
      - 'おだいじに'
      - 'おめでとう'
    answer: 2
    explanation:
      en: 'おだいじに wishes a sick person well.'
      es: 'おだいじに desea que alguien enfermo se mejore.'
    author: claude
    tts:
      script: "N: かぜを　ひいた　友だちと　わかれます。なんと　言いますか。\nN: 1　いただきます\nN: 2　おだいじに\nN: 3　おめでとう"
      voices: ['narrator']
  - id: n4-lis-3-0010
    stem: '会社で、ほかの　人より　先に　帰ります。なんと　言いますか。'
    choices:
      - 'いってらっしゃい'
      - 'お先に　しつれいします'
      - 'おかえりなさい'
    answer: 2
    explanation:
      en: 'お先に しつれいします is said when leaving work before others.'
      es: 'お先に しつれいします se dice al irse del trabajo antes que los demás.'
    author: claude
    tts:
      script: "N: 会社で、ほかの　人より　先に　帰ります。なんと　言いますか。\nN: 1　いってらっしゃい\nN: 2　お先に　しつれいします\nN: 3　おかえりなさい"
      voices: ['narrator']
  - id: n4-lis-3-0011
    stem: 'レストランで　お店の　人を　よびたいです。なんと　言いますか。'
    choices:
      - 'ごちそうさま'
      - 'いらっしゃいませ'
      - 'すみません'
    answer: 3
    explanation:
      en: 'すみません calls the staff.'
      es: 'すみません sirve para llamar al personal.'
    author: claude
    tts:
      script: "N: レストランで　お店の　人を　よびたいです。なんと　言いますか。\nN: 1　ごちそうさま\nN: 2　いらっしゃいませ\nN: 3　すみません"
      voices: ['narrator']
  - id: n4-lis-3-0012
    stem: '友だちに　じしょを　借りたいです。なんと　言いますか。'
    choices:
      - 'じしょを　貸して　くれない？'
      - 'じしょを　貸して　あげようか'
      - 'じしょを　借りて　くれない？'
    answer: 1
    explanation:
      en: 'You ask your friend to lend it: 貸して くれない？'
      es: 'Pides que te lo preste: 貸して くれない？'
    author: claude
    tts:
      script: "N: 友だちに　じしょを　借りたいです。なんと　言いますか。\nN: 1　じしょを　貸して　くれない？\nN: 2　じしょを　貸して　あげようか\nN: 3　じしょを　借りて　くれない？"
      voices: ['narrator']
  - id: n4-lis-3-0013
    stem: 'お客さんに　お茶を　出します。なんと　言いますか。'
    choices:
      - 'どうぞ、めしあがって　ください'
      - 'どうぞ、いただいて　ください'
      - 'いただきます'
    answer: 1
    explanation:
      en: 'めしあがる is the respectful "eat, drink" for a guest.'
      es: 'めしあがる es el respetuoso "comer, beber" para un invitado.'
    author: claude
    tts:
      script: "N: お客さんに　お茶を　出します。なんと　言いますか。\nN: 1　どうぞ、めしあがって　ください\nN: 2　どうぞ、いただいて　ください\nN: 3　いただきます"
      voices: ['narrator']
  - id: n4-lis-3-0014
    stem: '友だちの　家に　入ります。なんと　言いますか。'
    choices:
      - 'おじゃましました'
      - 'ただいま'
      - 'おじゃまします'
    answer: 3
    explanation:
      en: 'おじゃまします on entering; おじゃましました on leaving.'
      es: 'おじゃまします al entrar; おじゃましました al salir.'
    author: claude
    tts:
      script: "N: 友だちの　家に　入ります。なんと　言いますか。\nN: 1　おじゃましました\nN: 2　ただいま\nN: 3　おじゃまします"
      voices: ['narrator']
  - id: n4-lis-3-0015
    stem: '電車で　おばあさんに　席を　ゆずりたいです。なんと　言いますか。'
    choices:
      - 'どうぞ、立って　ください'
      - 'どうぞ、すわって　ください'
      - 'すみません、すわっても　いいですか'
    answer: 2
    explanation:
      en: 'You offer your seat: どうぞ、すわって ください.'
      es: 'Ofreces tu asiento: どうぞ、すわって ください.'
    author: claude
    tts:
      script: "N: 電車で　おばあさんに　席を　ゆずりたいです。なんと　言いますか。\nN: 1　どうぞ、立って　ください\nN: 2　どうぞ、すわって　ください\nN: 3　すみません、すわっても　いいですか"
      voices: ['narrator']
