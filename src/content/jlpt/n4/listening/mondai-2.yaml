    explanation:
      en: 'Piano is in the past; now she wants to learn cooking.'
      es: 'El piano ya pasó; ahora quiere aprender cocina.'
    author: claude
    tts:
      script: "N: 男の　人と　女の　人が　話して　います。女の　人は　何を　習いたいと　言って　いますか。\nM: 何か　習いごとを　して　いる？\nF: 前は　ピアノを　習って　いたけど、やめたの。今は　料理を　習いたいと　思って　いるんだ。\nM: へえ、いいね。\nN: 女の　人は　何を　習いたいと　言って　いますか。"
      voices: ['narrator', 'man', 'woman']
