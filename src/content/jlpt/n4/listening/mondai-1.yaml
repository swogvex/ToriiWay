      en: 'He picks the small black one because it fits in his bag.'
      es: 'Elige el negro pequeño porque cabe en la bolsa.'
    author: claude
    tts:
      script: "N: 店で　男の　人と　店の　人が　話して　います。男の　人は　どの　かさを　買いますか。\nM: 黒い　かさが　ほしいんですが。\nF: こちらの　大きい　黒い　かさと、小さい　黒い　かさが　あります。小さい　ほうは　かばんに　入れられますよ。\nM: かばんに　入れられるのは　べんりですね。それに　します。\nN: 男の　人は　どの　かさを　買いますか。"
      voices: ['narrator', 'man', 'woman']
  - id: n4-lis-1-0015
    stem: '女の　人は　空港まで　なにで　行きますか。'
    choices:
      - 'タクシー'
      - '電車'
      - 'バス'
      - '車'
    answer: 2
    explanation:
      en: 'The roads will be busy, so she follows his advice and takes the train.'
      es: 'Habrá tráfico, así que sigue su consejo y va en tren.'
    author: claude
    tts:
      script: "N: 男の　人と　女の　人が　話して　います。女の　人は　空港まで　なにで　行きますか。\nM: あした　空港まで　どうやって　行く？タクシー？\nF: タクシーは　高いから、バスで　行こうと　思ってる。\nM: あしたは　朝　道が　こむから、電車の　ほうが　いいよ。\nF: そうか。じゃあ、そう　する。\nN: 女の　人は　空港まで　なにで　行きますか。"
      voices: ['narrator', 'man', 'woman']
  - id: n4-lis-1-0016
