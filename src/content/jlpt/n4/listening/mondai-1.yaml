      es: 'De la página 50 a la 60, salvo la 55, que no entra.'
    author: claude
    tts:
      script: "N: 先生が　話して　います。学生は　テストの　ために　どこを　勉強しますか。\nF: あしたの　テストは　教科書の　五十ページから　六十ページまでです。でも、五十五ページの　問題は　出ませんから、勉強しなくても　いいです。\nN: 学生は　テストの　ために　どこを　勉強しますか。"
      voices: ['narrator', 'woman']
  - id: n4-lis-1-0014
    stem: '男の　人は　どの　かさを　買いますか。'
    choices:
      - '大きい　青い　かさ'
      - '大きい　黒い　かさ'
      - '小さい　青い　かさ'
      - '小さい　黒い　かさ'
    answer: 4
