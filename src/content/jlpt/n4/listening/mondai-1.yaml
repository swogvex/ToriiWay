      - '学校'
      - '家'
      - '駅の　前の　きっさてん'
      - '図書館'
    answer: 2
    explanation:
      en: 'The library is closed and the café is noisy, so she studies at home.'
      es: 'La biblioteca está cerrada y la cafetería es ruidosa, así que estudia en casa.'
    author: claude
    tts:
      script: "N: 男の　学生と　女の　学生が　話して　います。女の　学生は　きょう　どこで　勉強しますか。\nM: きょう　図書館で　いっしょに　勉強しない？\nF: 図書館は　きょう　休みだよ。\nM: じゃあ、駅の　前の　きっさてんは？\nF: あそこは　うるさいから、わたしは　家で　勉強する。\nN: 女の　学生は　きょう　どこで　勉強しますか。"
