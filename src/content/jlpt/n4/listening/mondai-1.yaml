      es: 'Ella quiere revisarlo antes, así que él se lo lleva ahora.'
    author: claude
    tts:
      script: "N: 会社で　女の　人と　男の　人が　話して　います。男の　人は　このあと　何を　しますか。\nF: 鈴木さん、きのう　お願いした　書類は　できましたか。\nM: はい、できました。部長に　見せましょうか。\nF: 部長は　きょう　休みなので、あした　見せて　ください。その　前に、わたしが　一度　チェックします。\nM: わかりました。じゃあ、今　持って　きます。\nN: 男の　人は　このあと　何を　しますか。"
      voices: ['narrator', 'man', 'woman']
  - id: n4-lis-1-0021
    stem: '女の　学生は　きょう　どこで　勉強しますか。'
