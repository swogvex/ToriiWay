    choices:
      - '飲み物と　くだもの'
      - '飲み物'
      - 'ケーキ'
      - 'くだもの'
    answer: 4
    explanation:
      en: 'Drinks are covered and Tanaka brings cake; she brings fruit.'
      es: 'Bebida hay y Tanaka trae tarta; ella lleva fruta.'
    author: claude
    tts:
      script: "N: 男の　人と　女の　人が　電話で　話して　います。女の　人は　パーティーに　何を　持って　いきますか。\nF: あしたの　パーティー、何か　持って　いこうか。\nM: 飲み物は　たくさん　あるから、いらないよ。ケーキは　田中さんが　持って　くるって。\nF: じゃあ、くだものは？\nM: いいね。お願い。\nN: 女の　人は　パーティーに　何を　持って　いきますか。"
      voices: ['narrator', 'man', 'woman']
  - id: n4-lis-1-0018
    stem: '男の　人は　何曜日に　病院へ　来ますか。'
    choices:
      - '月曜日'
      - '木曜日'
      - '金曜日'
      - '水曜日'
    answer: 3
    explanation:
      en: 'Monday he works and Wednesday afternoon is full, so Friday.'
      es: 'El lunes trabaja y el miércoles por la tarde está lleno, así que el viernes.'
    author: claude
    tts:
      script: "N: 病院で　男の　人と　うけつけの　人が　話して　います。男の　人は　何曜日に　来ますか。\nM: 来週、もう　一度　来たいんですが。\nF: 月曜日と　水曜日は　いかがですか。\nM: 月曜日は　仕事が　あるので、水曜日に　お願いします。\nF: すみません、水曜日は　午後が　いっぱいです。午前なら　だいじょうぶですが。\nM: 午前は　ちょっと…。じゃあ、金曜日は？\nF: 金曜日の　午後は　あいて　います。\nM: では、金曜日に　お願いします。\nN: 男の　人は　何曜日に　来ますか。"
      voices: ['narrator', 'man', 'woman']
  - id: n4-lis-1-0019
    stem: '女の　人は　何時の　電車に　乗りますか。'
    choices:
      - '八時四十分'
      - '九時五十分'
      - '九時'
      - '十時十分'
    answer: 1
    explanation:
      en: 'Only the 8:40 arrives before ten.'
      es: 'Solo el de las 8:40 llega antes de las diez.'
    author: claude
    tts:
      script: "N: 駅で　女の　人と　男の　人が　話して　います。女の　人は　何時の　電車に　乗りますか。\nF: 十時に　東京駅に　着きたいんですが、どの　電車が　いいですか。\nM: 九時の　電車だと　十時十分に　着きます。八時四十分の　電車なら　九時五十分に　着きますよ。\nF: じゃあ、八時四十分のに　します。\nN: 女の　人は　何時の　電車に　乗りますか。"
      voices: ['narrator', 'man', 'woman']
  - id: n4-lis-1-0020
    stem: '男の　人は　このあと　何を　しますか。'
    choices:
      - '書類を　作る'
      - '女の　人に　書類を　わたす'
      - 'あした　会社を　休む'
      - '部長に　書類を　見せる'
    answer: 2
