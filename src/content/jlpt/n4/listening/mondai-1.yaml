      en: 'He has no card yet, so he must make one at reception first.'
      es: 'Aún no tiene tarjeta, así que primero la hace en recepción.'
    author: claude
    tts:
      script: "N: 図書館で　男の　学生と　図書館の　人が　話して　います。男の　学生は　このあと　何を　しますか。\nM: すみません、この　本を　借りたいんですが。\nF: 図書館カードは　ありますか。\nM: いいえ、まだ　作って　いません。\nF: では、まず　あちらの　うけつけで　カードを　作って　ください。\nN: 男の　学生は　このあと　何を　しますか。"
      voices: ['narrator', 'man', 'woman']
  - id: n4-lis-1-0017
