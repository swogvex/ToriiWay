    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n2-lis-4-0005-41c166d63a5f.mp3'
    tts:
      script: "M: もう　少し　早く　言って　くれれば　よかったのに。\nF: 1　ごめん、なかなか　言い出せなくて\nF: 2　じゃあ、もっと　遅く　言うね\nF: 3　うん、早く　言ったよね"
