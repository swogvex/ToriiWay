    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n2-lis-4-0007-16c0703d1a6a.mp3'
    tts:
      script: "M: この　プロジェクト、君に　任せても　いいかな。\nF: 1　はい、任せて　いただきました\nF: 2　いえ、わたしが　お任せします\nF: 3　はい、精一杯　やらせて　いただきます"
