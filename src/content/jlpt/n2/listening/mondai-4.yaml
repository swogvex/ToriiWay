    explanation:
      en: '今日に 限って: today of all days, unusually.'
      es: '今日に 限って: justo hoy, cosa rara.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n2-lis-4-0004-6ff5f07febdb.mp3'
    tts:
      script: "F: 山田さん、今日に　限って　遅いね。\nM: 1　そうだね、いつも　遅いね\nM: 2　うん、今日だけ　早く　来たよ\nM: 3　ほんと、いつもは　一番に　来るのにね"
      voices: ['man', 'woman']
  - id: n2-lis-4-0005
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'ごめん、なかなか　言い出せなくて'
      - 'じゃあ、もっと　遅く　言うね'
      - 'うん、早く　言ったよね'
