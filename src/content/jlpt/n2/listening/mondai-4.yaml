    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n2-lis-4-0008-06ce499fd04d.mp3'
    tts:
      script: "F: 駅まで　歩くと　けっこう　かかるよ。\nM: 1　じゃあ、バスで　行こうかな\nM: 2　うん、すぐ　着いたね\nM: 3　歩くのは　かからないよ"
