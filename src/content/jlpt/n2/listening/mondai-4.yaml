    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n2-lis-4-0006-8127d924cefc.mp3'
    tts:
      script: "F: あの　店、行って　みたら　たいした　ことなかったよ。\nM: 1　へえ、すごく　おいしかったんだね\nM: 2　そうなんだ。評判ほどじゃ　なかったんだね\nM: 3　じゃあ、また　行こうよ"
      voices: ['man', 'woman']
  - id: n2-lis-4-0007
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
