# N2 · Listening · Mondai 4 — quick response
# Original questions written for ToriiWay.
level: N2
section: listening
mondai: 4
instruction:
  en: 'Listen to the sentence and the three replies. Choose the best reply.'
  ja: '文を 聞いて、１から３の 中から、最も よい 返事を えらんで ください。'
questions:
  - id: n2-lis-4-0001
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'はい、目に　入れて　おきます'
      - '承知しました。夕方までに　見て　おきます'
      - 'いえ、通して　いただきました'
    answer: 2
    explanation:
      en: '目を 通す: look through. She agrees politely.'
      es: '目を 通す: revisar. Ella acepta con cortesía.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n2-lis-4-0001-bfdaa18e3fd8.mp3'
    tts:
      script: "M: この　書類、今日中に　目を　通して　いただけますか。\nF: 1　はい、目に　入れて　おきます\nF: 2　承知しました。夕方までに　見て　おきます\nF: 3　いえ、通して　いただきました"
      voices: ['man', 'woman']
  - id: n2-lis-4-0002
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'うん、留守番して　おくね'
      - 'せっかくだから、また　来てね'
      - 'ううん、急に　来た　僕が　悪いんだよ'
    answer: 3
    explanation:
      en: 'He reassures her: it was his fault for dropping by.'
      es: 'Él la tranquiliza: fue culpa suya pasar sin avisar.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n2-lis-4-0002-3f13741070eb.mp3'
    tts:
      script: "F: せっかく　来て　もらったのに、留守に　してて　ごめんね。\nM: 1　うん、留守番して　おくね\nM: 2　せっかくだから、また　来てね\nM: 3　ううん、急に　来た　僕が　悪いんだよ"
      voices: ['man', 'woman']
  - id: n2-lis-4-0003
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'ええ、お疲れさま'
      - 'ええ、お先に　どうぞ　召し上がって'
      - 'いえ、失礼しました'
    answer: 1
    explanation:
      en: 'Permission to leave first: お疲れさま.'
      es: 'Permiso para irse antes: お疲れさま.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n2-lis-4-0003-9a5f02b30f14.mp3'
    tts:
      script: "M: お先に　失礼しても　よろしいでしょうか。\nF: 1　ええ、お疲れさま\nF: 2　ええ、お先に　どうぞ　召し上がって\nF: 3　いえ、失礼しました"
      voices: ['man', 'woman']
  - id: n2-lis-4-0004
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'そうだね、いつも　遅いね'
      - 'うん、今日だけ　早く　来たよ'
      - 'ほんと、いつもは　一番に　来るのにね'
