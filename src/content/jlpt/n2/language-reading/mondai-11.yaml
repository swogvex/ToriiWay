# N2 · Language knowledge · Reading · Mondai 11 — mid-size passages
# Original questions written for ToriiWay.
level: N2
section: language-reading
mondai: 11
instruction:
  en: 'Read the text and answer the questions.'
  ja: 'つぎの 文章を 読んで、後の 問いに 対する 答えとして 最も よい ものを えらんで ください。'
passages:
  - id: manual
    text: "　新しく入った社員には、まず仕事のマニュアルを渡すことが多い。マニュアルがあれば、誰でも同じ手順で仕事ができ、失敗も減る。その点で、マニュアルはとても便利なものだ。\n　しかし、マニュアルに頼りすぎると、困ったことも起きる。書かれていない事態が起きたとき、どうしていいかわからなくなってしまうのだ。ある店で、客から珍しい注文を受けた新人が、マニュアルにないという理由で断ってしまったという話を聞いた。少し考えれば、対応できる内容だったという。\n　マニュアルは、仕事の基本を身につけるための道具である。大切なのは、なぜその手順なのかを理解することだ。理由がわかっていれば、マニュアルにない場面でも、自分で考えて行動できるようになるだろう。"
  - id: countryside
    text: "　最近、都会から地方の町に移り住む人が増えている。わたしの友人も、三年前に東京の会社を辞め、山に囲まれた小さな町で暮らし始めた。\n　友人によれば、地方の暮らしには不便なこともある。店は少なく、車がなければどこにも行けない。冬は雪が深く、雪かきも大変だそうだ。それでも友人は、「東京にいたころより、ずっと気持ちに余裕がある」と言う。仕事はインターネットを使って続けており、空いた時間には近所の人と畑仕事をしているそうだ。\n　移住を成功させるためには、地域の人との関係が大切だと友人は話していた。都会のやり方を押しつけず、まずは地域の行事に参加すること。そうするうちに、困ったときに助け合える関係ができるのだという。"
  - id: sleep
    text: "　「睡眠時間を削って勉強した」という話を、学生からよく聞く。しかし、睡眠を削ることは、必ずしも勉強の効率を上げない。\n　研究によると、人は眠っている間に、その日に覚えたことを整理し、記憶として定着させているという。つまり、十分に眠らなければ、せっかく勉強した内容も頭に残りにくいのだ。また、睡眠不足の状態では集中力が落ちるため、同じ時間勉強しても、身につく量が少なくなってしまう。\n　試験の前ほど、しっかり眠ることを心がけたい。夜遅くまで無理をするより、早く寝て、朝の頭がすっきりした時間に復習する方が、結果的に良い成績につながるはずだ。"
  - id: playground
    text: "　わたしが子どものころ、近所の空き地は子どもたちの遊び場だった。そこには遊具もなく、決まった遊び方もなかった。だからこそ、わたしたちは毎日、新しい遊びを考え出していた。\n　今の公園には、安全な遊具がそろっている。けがをしにくいように作られており、親も安心して子どもを遊ばせることができる。しかし、遊び方が決まった遊具ばかりでは、子どもが自分で工夫する機会が少なくなるのではないかと、わたしは心配している。\n　最近、木の枝や段ボールなどを自由に使って遊べる「冒険遊び場」が各地にできているそうだ。多少の危険はあっても、子どもが自分で考えて遊ぶ場所は、子どもの成長にとって大切な役割を果たすだろう。"
  - id: keigo
    text: "　「敬語が苦手だ」という若者は多い。特に、尊敬語と謙譲語の使い分けは、社会人になってからも難しいと感じる人が少なくない。\n　敬語が難しいのは、ルールが複雑だからだけではない。相手との関係や場面によって、使う言葉を変えなければならないからだ。同じ人に対しても、会社の中と外では話し方が変わることがある。\n　しかし、敬語は相手との距離を作るためのものではない。相手を大切に思っていることを伝えるための言葉である。完ぺきに使えなくても、相手を思う気持ちがあれば、それは必ず伝わる。間違いを恐れず、少しずつ使いながら覚えていけばいいのではないだろうか。"
  - id: pets
    text: "　一人暮らしの高齢者が増える中、ペットを飼う高齢者も増えている。犬や猫と暮らすことで、毎日の生活に張りが出るという人は多い。犬の散歩のために外に出る機会が増え、近所の人と話すきっかけにもなるそうだ。\n　一方で、問題もある。飼い主が病気になったり、施設に入ったりして、ペットの世話ができなくなるケースだ。残されたペットの行き先が見つからず、困る家族も少なくない。\n　そこで最近は、飼い主に何かあったときにペットを引き取る仕組みを作る団体も出てきた。ペットと暮らす喜びを、年齢に関係なく安心して味わえる社会になってほしいと思う。"
  - id: secondhand
    text: "　最近、若い人の間で古着の人気が高まっている。わたしの大学でも、古着を上手に組み合わせておしゃれを楽しむ学生をよく見かける。\n　古着が好まれる理由の一つは、値段の安さだ。しかし、それだけではない。古着には、今の店では手に入らない、一点ものの服が多い。人と同じ服を着たくないという若者にとって、古着は自分らしさを表す手段になっているのだ。\n　また、古着を選ぶことが、環境を守ることにつながると考える人もいる。服を作るには多くの水やエネルギーが必要で、捨てられる服も大量にある。まだ着られる服を次の人に回すことは、小さいながらも意味のある行動だと言えるだろう。"
  - id: notebook
    text: "　スマートフォンで予定を管理する人が多い中、わたしは今でも紙の手帳を使っている。周りの人からは「不便でしょう」と言われるが、わたしにとっては手放せない道具だ。\n　手帳のいいところは、一週間の予定を一目で見渡せることだ。予定を手で書き込むと、自然に頭の中も整理される。空いている時間がすぐにわかるので、無理な予定を入れることも少なくなった。\n　もちろん、スマートフォンにも便利な点は多い。わたしも、人と予定を共有するときはスマートフォンを使っている。大切なのは、どちらが優れているかではなく、自分に合った方法を見つけることなのだと思う。"
  - id: volunteer
    text: "　大学二年の夏、わたしは被災地でボランティア活動に参加した。最初は「人の役に立ちたい」という気持ちだけで、何ができるのかもよくわかっていなかった。\n　現地での仕事は、家の中の泥を運び出すことだった。暑さの中での作業は想像以上につらく、一日が終わると体が動かないほどだった。しかし、作業が終わった家の人から「本当に助かった」と言われたとき、疲れを忘れるほどうれしかった。\n　この経験で、わたしは助けることは同時に、多くのことを教えてもらうことでもあると知った。地域の人たちが協力して前に進もうとする姿は、今でもわたしの心に強く残っている。"
questions:
  - id: n2-lr-11-0001
    passage: manual
    stem: '筆者は　マニュアルの　よい　点を　何だと　述べて　いるか。'
    choices:
      - '客の　珍しい　注文に　答えられる　こと'
      - '新人が　すぐに　辞めなく　なる　こと'
      - 'だれでも　同じ　手順で　仕事が　でき、失敗が　減る　こと'
      - '仕事の　量が　少なく　なる　こと'
    answer: 3
    explanation:
      en: 'Everyone can follow the same steps, so mistakes fall.'
      es: 'Todos siguen los mismos pasos y hay menos errores.'
    author: claude
  - id: n2-lr-11-0002
    passage: manual
    stem: '新人が　客の　注文を　断ったのは　なぜか。'
