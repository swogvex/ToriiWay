# N2 · Language knowledge · Reading · Mondai 8 — sentence composition
# Original questions written for ToriiWay.
level: N2
section: language-reading
mondai: 8
instruction:
  en: 'Put the four parts in order. Which part goes in ★?'
  ja: 'つぎの 文の ★ に 入る 最も よい ものを えらんで ください。'
questions:
  - id: n2-lr-8-0001
    stem: 'この　仕事は　＿＿＿　＿＿＿　★　＿＿＿　終わらない。'
    choices:
      - 'ところで'
      - '今日中には'
      - '急いだ'
      - 'どんなに'
    answer: 1
    explanation:
      en: 'どんなに 急いだ ところで 今日中には 終わらない.'
      es: 'どんなに 急いだ ところで 今日中には 終わらない: "Por mucha prisa que me dé, hoy no se acaba."'
    author: claude
  - id: n2-lr-8-0002
    stem: '一度　＿＿＿　＿＿＿　★　＿＿＿　守るべきだ。'
    choices:
      - 'した'
      - '約束'
      - '最後まで'
      - '以上は'
    answer: 4
    explanation:
      en: '一度 約束 した 以上は 最後まで 守るべきだ.'
      es: '一度 約束 した 以上は 最後まで 守るべきだ: "Una promesa hecha hay que cumplirla hasta el final."'
    author: claude
  - id: n2-lr-8-0003
