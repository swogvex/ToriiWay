# N3 · Vocabulary · Mondai 4 — paraphrase
# Original questions written for ToriiWay.
level: N3
section: vocabulary
mondai: 4
instruction:
  en: 'Choose the answer closest in meaning to the underlined part.'
  ja: '＿＿＿に 意味が 最も 近い ものを えらんで ください。'
questions:
  - id: n3-voc-4-0001
    stem: 'この　問題は　__ややこしい__。'
    choices:
      - '簡単だ'
      - '新しい'
      - '複雑だ'
      - '大切だ'
    answer: 3
    explanation:
      en: 'ややこしい ≈ 複雑だ, "complicated".'
      es: 'ややこしい ≈ 複雑だ, "complicado".'
    author: claude
  - id: n3-voc-4-0002
    stem: '会議は　__たちまち__　終わった。'
    choices:
      - 'すぐに'
      - 'やっと'
      - 'ゆっくり'
      - 'ずっと'
