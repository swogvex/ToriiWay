    choices:
      - '味は'
      - '地味だ'
      - 'けれど'
      - '見た目は'
    answer: 2
    explanation:
      en: 'この 店の ケーキは 見た目は 地味だ けれど 味は おいしい.'
      es: 'この 店の ケーキは 見た目は 地味だ けれど 味は おいしい: "La tarta parece sencilla pero está rica."'
