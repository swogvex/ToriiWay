# N3 · Grammar · Reading · Mondai 2 — sentence composition
# Original questions written for ToriiWay.
level: N3
section: grammar-reading
mondai: 2
instruction:
  en: 'Put the four parts in order. Which part goes in ★?'
  ja: '★に 入る 最も よい ものを えらんで ください。'
questions:
  - id: n3-grm-2-0001
    stem: '彼は　＿＿＿　＿＿＿　★　＿＿＿　しまった。'
    choices:
      - 'ばかりなのに'
      - '注意された'
      - '先生に'
      - 'また遅刻して'
    answer: 1
    explanation:
      en: '彼は 先生に 注意された ばかりなのに また遅刻して しまった.'
      es: '彼は 先生に 注意された ばかりなのに また遅刻して しまった: "Le acababan de llamar la atención y volvió a llegar tarde."'
    author: claude
  - id: n3-grm-2-0002
