    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n3-lis-5-0005-fdb81a7901db.mp3'
    tts:
      script: "M: ご注文は　お決まりですか。\nF: 1　はい、決まって　いません\nF: 2　いいえ、注文します\nF: 3　もう　少し　待って　もらえますか"
      voices: ['man', 'woman']
  - id: n3-lis-5-0006
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
