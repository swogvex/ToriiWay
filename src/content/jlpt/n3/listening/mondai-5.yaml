# N3 · Listening · Mondai 5 — quick response
# Original questions written for ToriiWay.
level: N3
section: listening
mondai: 5
instruction:
  en: 'Listen to the sentence and the three replies. Choose the best reply.'
  ja: '文を 聞いて、１から３の 中から、最も よい 返事を えらんで ください。'
questions:
  - id: n3-lis-5-0001
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'たしか　十時からだったと　思う'
      - '十時に　会議が　終わったよ'
      - 'うん、会議に　出るよ'
    answer: 1
    explanation:
      en: 'He asks the time; she recalls it.'
      es: 'Pregunta la hora; ella la recuerda.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n3-lis-5-0001-595821468c83.mp3'
    tts:
      script: "M: あしたの　会議、何時からか　覚えてる？\nF: 1　たしか　十時からだったと　思う\nF: 2　十時に　会議が　終わったよ\nF: 3　うん、会議に　出るよ"
      voices: ['man', 'woman']
  - id: n3-lis-5-0002
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'はい、あした　お願いします'
      - 'いいえ、書類では　ありません'
      - 'はい、なんとか　やって　みます'
    answer: 3
    explanation:
      en: 'Accepting a request: なんとか やって みます.'
      es: 'Aceptar un encargo: なんとか やって みます.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n3-lis-5-0002-fcb0cb5a9267.mp3'
    tts:
      script: "F: この　書類、あしたまでに　お願いできますか。\nM: 1　はい、あした　お願いします\nM: 2　いいえ、書類では　ありません\nM: 3　はい、なんとか　やって　みます"
      voices: ['man', 'woman']
  - id: n3-lis-5-0003
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'ええ、外して　あげます'
      - 'どうぞ、ごゆっくり'
      - 'いえ、席は　ありません'
    answer: 2
    explanation:
      en: 'Giving permission to step out.'
      es: 'Dar permiso para ausentarse un momento.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n3-lis-5-0003-0a28ed38388d.mp3'
    tts:
      script: "M: すみません、ちょっと　席を　外しても　いいですか。\nF: 1　ええ、外して　あげます\nF: 2　どうぞ、ごゆっくり\nF: 3　いえ、席は　ありません"
      voices: ['man', 'woman']
  - id: n3-lis-5-0004
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'ありがとう。助かるよ'
      - 'うん、駅に　送ったよ'
      - 'うん、送って　あげるよ'
    answer: 1
    explanation:
      en: 'Accepting the offer with thanks.'
      es: 'Aceptar la oferta con gratitud.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n3-lis-5-0004-de684ad4219c.mp3'
    tts:
      script: "F: 駅まで　送って　いこうか。\nM: 1　ありがとう。助かるよ\nM: 2　うん、駅に　送ったよ\nM: 3　うん、送って　あげるよ"
      voices: ['man', 'woman']
  - id: n3-lis-5-0005
    stem: '最も　よい　返事を　えらんで　ください。'
    choices:
      - 'はい、決まって　いません'
      - 'いいえ、注文します'
      - 'もう　少し　待って　もらえますか'
