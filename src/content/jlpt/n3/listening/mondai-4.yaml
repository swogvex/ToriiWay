  - id: n3-lis-4-0008
    stem: '店で　ほしい　商品が　見つかりません。店員に　なんと　言いますか。'
    choices:
      - 'すみません、この　商品は　どこに　ありますか'
      - 'すみません、この　商品は　ありましたか'
      - 'すみません、この　商品を　探して　あげましょうか'
    answer: 1
    explanation:
      en: 'You ask where it is.'
      es: 'Preguntas dónde está.'
