# N3 · Listening · Mondai 4 — utterance expressions
# Original questions written for ToriiWay.
level: N3
section: listening
mondai: 4
instruction:
  en: 'Read the situation and listen. What do you say? Choose 1, 2 or 3.'
  ja: '文を 読んで、聞いて ください。なんと 言いますか。１から３の 中から、最も よい ものを えらんで ください。'
questions:
  - id: n3-lis-4-0001
    stem: '会議室を　使いたいです。上司に　なんと　言いますか。'
    choices:
      - '会議室を　使って　いただけませんか'
      - '会議室を　使わせて　いただけませんか'
      - '会議室を　使わせて　あげましょうか'
    answer: 2
    explanation:
      en: 'Asking permission politely: 〜させて いただけませんか.'
      es: 'Pedir permiso con cortesía: 〜させて いただけませんか.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n3-lis-4-0001-50c747c637c8.mp3'
    tts:
      script: "N: 会議室を　使いたいです。上司に　なんと　言いますか。\nN: 1　会議室を　使って　いただけませんか\nN: 2　会議室を　使わせて　いただけませんか\nN: 3　会議室を　使わせて　あげましょうか"
      voices: ['narrator']
  - id: n3-lis-4-0002
    stem: '友だちの　かばんが　開いて　います。なんと　言いますか。'
    choices:
      - 'かばん、開けても　いい？'
      - 'かばん、開けて　あげるね'
      - 'かばん、開いて　いるよ'
    answer: 3
    explanation:
      en: 'You simply tell your friend the bag is open.'
      es: 'Simplemente le avisas de que la bolsa está abierta.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n3-lis-4-0002-8ba595642806.mp3'
    tts:
      script: "N: 友だちの　かばんが　開いて　います。なんと　言いますか。\nN: 1　かばん、開けても　いい？\nN: 2　かばん、開けて　あげるね\nN: 3　かばん、開いて　いるよ"
      voices: ['narrator']
  - id: n3-lis-4-0003
    stem: '先生に　推薦状を　書いて　もらいたいです。なんと　言いますか。'
    choices:
      - '推薦状を　書いて　いただけないでしょうか'
      - '推薦状を　書かせて　いただけないでしょうか'
      - '推薦状を　お書きしましょうか'
    answer: 1
    explanation:
      en: 'You ask the teacher to write it: 〜て いただけないでしょうか.'
      es: 'Pides al profesor que la escriba: 〜て いただけないでしょうか.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n3-lis-4-0003-2931c22bcf9f.mp3'
    tts:
      script: "N: 先生に　推薦状を　書いて　もらいたいです。なんと　言いますか。\nN: 1　推薦状を　書いて　いただけないでしょうか\nN: 2　推薦状を　書かせて　いただけないでしょうか\nN: 3　推薦状を　お書きしましょうか"
      voices: ['narrator']
  - id: n3-lis-4-0004
    stem: '電車で　となりの　人の　荷物が　足に　当たって　痛いです。なんと　言いますか。'
    choices:
      - 'すみません、荷物が　足に　当たって　いるんですが'
      - 'すみません、足を　どけましょうか'
      - 'すみません、荷物を　持ちましょうか'
    answer: 1
    explanation:
      en: 'You politely point out the problem.'
      es: 'Señalas el problema con educación.'
    author: claude
    audio: 'https://zmzyiqao9nzbcbfv.public.blob.vercel-storage.com/jlpt/audio/n3-lis-4-0004-85988667fbb4.mp3'
    tts:
      script: "N: 電車で　となりの　人の　荷物が　足に　当たって　痛いです。なんと　言いますか。\nN: 1　すみません、荷物が　足に　当たって　いるんですが\nN: 2　すみません、足を　どけましょうか\nN: 3　すみません、荷物を　持ちましょうか"
      voices: ['narrator']
  - id: n3-lis-4-0005
    stem: 'お客さんが　帰ります。なんと　言いますか。'
    choices:
      - 'おじゃましました'
      - 'いらっしゃいませ'
      - 'お気を　つけて　お帰りください'
    answer: 3
    explanation:
      en: 'Seeing a guest off: お気を つけて お帰りください.'
      es: 'Al despedir a un invitado: お気を つけて お帰りください.'
