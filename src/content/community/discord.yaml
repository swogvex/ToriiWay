# Discord card on /community and Home. Draft by Claude (owner, 2026-11-06): correct the
# description and the channels to match the real server. Channel names: lowercase-with-dashes.
name: Nihongo No Torii
description:
  en: A Spanish–Japanese community for learning together. Ask questions, share what helps you and practise with other learners at every level.
  es: Una comunidad hispano-japonesa para aprender juntos. Pregunta dudas, comparte lo que te ayuda y practica con otros estudiantes de todos los niveles.
channels:
  - name: general
    description:
      en: Say hello, talk about your day and anything Japanese.
      es: Saluda y habla de tu día y de todo lo relacionado con Japón.
  - name: questions
    description:
      en: Stuck on a kana, a word or a grammar point? Ask here.
      es: ¿Te atascas con un kana, una palabra o un punto de gramática? Pregunta aquí.
  - name: resources
    description:
      en: Books, apps and videos that worked for you.
      es: Libros, apps y vídeos que te han funcionado.
  - name: study-together
    description:
      en: Voice rooms to study in company and keep each other going.
      es: Salas de voz para estudiar acompañado y motivaros entre todos.
# "Server rules" on /community. Draft by Claude (owner, 2026-11-06): edit freely.
rules:
  - en: Be kind. Everyone here is learning, and every question is welcome.
    es: Sé amable. Aquí todos estamos aprendiendo y cualquier pregunta es bienvenida.
  - en: Correct others gently, and explain why when you can.
    es: Corrige con tacto y, si puedes, explica por qué.
  - en: Keep each channel on its topic; use general for everything else.
    es: Mantén cada canal en su tema; para todo lo demás está general.
  - en: No spam, self-promotion or links to pirated material.
    es: Nada de spam, autopromoción ni enlaces a material pirata.
  - en: Spanish, Japanese and English are all fine. Write in the one you can.
    es: 'Puedes escribir en español, japonés o inglés: en el que sepas.'
