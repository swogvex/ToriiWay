# Kanji Hard: short N4–N3 sentences. Original sentences; the reading is in kana.
# Particles are typed as written: は = "ha", へ = "he", を = "wo".
script: kanji
difficulty: hard
items:
  - text: '毎朝コーヒーを飲みます。'
    reading: 'まいあさコーヒーをのみます'
    en: 'I drink coffee every morning.'
    es: 'Bebo café todas las mañanas.'
  - text: '駅まで歩いて行きます。'
    reading: 'えきまであるいていきます'
    en: 'I walk to the station.'
    es: 'Voy andando a la estación.'
  - text: '週末は家族と映画を見ました。'
    reading: 'しゅうまつはかぞくとえいがをみました'
    en: 'At the weekend I watched a film with my family.'
    es: 'El fin de semana vi una película con mi familia.'
  - text: '日本語の勉強は楽しいです。'
    reading: 'にほんごのべんきょうはたのしいです'
    en: 'Studying Japanese is fun.'
    es: 'Estudiar japonés es divertido.'
  - text: '明日は雨が降るそうです。'
    reading: 'あしたはあめがふるそうです'
    en: 'I hear it will rain tomorrow.'
    es: 'Dicen que mañana va a llover.'
  - text: '図書館で本を借りました。'
    reading: 'としょかんでほんをかりました'
    en: 'I borrowed a book at the library.'
    es: 'Saqué un libro de la biblioteca.'
  - text: '窓を開けてもいいですか。'
    reading: 'まどをあけてもいいですか'
    en: 'May I open the window?'
    es: '¿Puedo abrir la ventana?'
  - text: '電車が遅れています。'
    reading: 'でんしゃがおくれています'
    en: 'The train is running late.'
    es: 'El tren va con retraso.'
  - text: '夏休みに海へ行きたいです。'
    reading: 'なつやすみにうみへいきたいです'
    en: 'I want to go to the sea in the summer holidays.'
    es: 'Quiero ir a la playa en las vacaciones de verano.'
  - text: '母は料理が上手です。'
    reading: 'はははりょうりがじょうずです'
    en: 'My mother is good at cooking.'
    es: 'Mi madre cocina muy bien.'
  - text: '宿題を忘れてしまいました。'
    reading: 'しゅくだいをわすれてしまいました'
    en: 'I forgot my homework.'
    es: 'Se me olvidaron los deberes.'
  - text: '駅の前で友達を待っています。'
    reading: 'えきのまえでともだちをまっています'
    en: 'I am waiting for a friend in front of the station.'
    es: 'Estoy esperando a un amigo delante de la estación.'
  - text: '部屋をきれいに掃除しました。'
    reading: 'へやをきれいにそうじしました'
    en: 'I cleaned the room thoroughly.'
    es: 'Limpié bien la habitación.'
  - text: '寒いので窓を閉めてください。'
    reading: 'さむいのでまどをしめてください'
    en: 'It is cold, so please close the window.'
    es: 'Hace frío, así que cierra la ventana, por favor.'
  - text: '新しい靴を買いに行きます。'
    reading: 'あたらしいくつをかいにいきます'
    en: 'I am going to buy new shoes.'
    es: 'Voy a comprar zapatos nuevos.'
  - text: '日曜日は何をしますか。'
    reading: 'にちようびはなにをしますか'
    en: 'What will you do on Sunday?'
    es: '¿Qué vas a hacer el domingo?'
  - text: '道に迷ってしまいました。'
    reading: 'みちにまよってしまいました'
    en: 'I got lost.'
    es: 'Me he perdido.'
  - text: '風邪をひいたので休みます。'
    reading: 'かぜをひいたのでやすみます'
    en: 'I caught a cold, so I will rest.'
    es: 'Me he resfriado, así que voy a descansar.'
  - text: '先生に質問してもいいですか。'
    reading: 'せんせいにしつもんしてもいいですか'
    en: 'May I ask the teacher a question?'
    es: '¿Puedo hacerle una pregunta al profesor?'
  - text: '天気がいい日は散歩します。'
    reading: 'てんきがいいひはさんぽします'
    en: 'On days with good weather I go for a walk.'
    es: 'Los días de buen tiempo salgo a pasear.'
  - text: '弟は野球が好きです。'
    reading: 'おとうとはやきゅうがすきです'
    en: 'My younger brother likes baseball.'
    es: 'A mi hermano pequeño le gusta el béisbol.'
  - text: '空港までバスで行きました。'
    reading: 'くうこうまでバスでいきました'
    en: 'I went to the airport by bus.'
    es: 'Fui al aeropuerto en autobús.'
  - text: '図書館では静かにしてください。'
    reading: 'としょかんではしずかにしてください'
    en: 'Please be quiet in the library.'
    es: 'Por favor, guarda silencio en la biblioteca.'
  - text: 'この店は昼から開きます。'
    reading: 'このみせはひるからあきます'
    en: 'This shop opens at noon.'
    es: 'Esta tienda abre a mediodía.'
