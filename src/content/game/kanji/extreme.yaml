# Kanji Extreme: natural N3+ sentences. Original sentences; the reading is in kana.
# Particles are typed as written: は = "ha", へ = "he", を = "wo".
script: kanji
difficulty: extreme
items:
  - text: '雨が降りそうなので、傘を持っていきます。'
    reading: 'あめがふりそうなのでかさをもっていきます'
    en: 'It looks like rain, so I will take an umbrella.'
    es: 'Parece que va a llover, así que me llevo el paraguas.'
  - text: '時間があれば、一緒に食事しませんか。'
    reading: 'じかんがあればいっしょにしょくじしませんか'
    en: 'If you have time, shall we have a meal together?'
    es: 'Si tienes tiempo, ¿comemos juntos?'
  - text: '会議は予定より遅れて始まった。'
    reading: 'かいぎはよていよりおくれてはじまった'
    en: 'The meeting started later than planned.'
    es: 'La reunión empezó más tarde de lo previsto.'
  - text: '健康のために、毎日少し歩くようにしている。'
    reading: 'けんこうのためにまいにちすこしあるくようにしている'
    en: 'I try to walk a little every day for my health.'
    es: 'Procuro caminar un poco cada día por mi salud.'
  - text: '駅に着いたら、電話してください。'
    reading: 'えきについたらでんわしてください'
    en: 'Please call me when you get to the station.'
    es: 'Llámame cuando llegues a la estación.'
  - text: '彼女は三年前から東京に住んでいる。'
    reading: 'かのじょはさんねんまえからとうきょうにすんでいる'
    en: 'She has lived in Tokyo for three years.'
    es: 'Ella vive en Tokio desde hace tres años.'
  - text: '窓が開いていたので、部屋が寒かった。'
    reading: 'まどがあいていたのでへやがさむかった'
    en: 'The window was open, so the room was cold.'
    es: 'La ventana estaba abierta, así que hacía frío en la habitación.'
  - text: '日本の文化について調べています。'
    reading: 'にほんのぶんかについてしらべています'
    en: 'I am researching Japanese culture.'
    es: 'Estoy investigando sobre la cultura japonesa.'
  - text: '試験に合格するために、毎晩勉強した。'
    reading: 'しけんにごうかくするためにまいばんべんきょうした'
    en: 'I studied every night to pass the exam.'
    es: 'Estudié todas las noches para aprobar el examen.'
  - text: '道が込んでいて、約束に間に合わなかった。'
    reading: 'みちがこんでいてやくそくにまにあわなかった'
    en: 'The roads were busy and I was late for my appointment.'
    es: 'Había mucho tráfico y no llegué a tiempo a la cita.'
  - text: '子供のころ、よくこの公園で遊んだ。'
    reading: 'こどものころよくこのこうえんであそんだ'
    en: 'As a child I often played in this park.'
    es: 'De niño jugaba a menudo en este parque.'
  - text: '料理が冷めないうちに食べてください。'
    reading: 'りょうりがさめないうちにたべてください'
    en: 'Please eat before the food gets cold.'
    es: 'Come antes de que se enfríe la comida.'
  - text: '荷物が重ければ、手伝いましょうか。'
    reading: 'にもつがおもければてつだいましょうか'
    en: 'If your luggage is heavy, shall I help?'
    es: 'Si el equipaje pesa, ¿te ayudo?'
  - text: '天気予報によると、明日は晴れるらしい。'
    reading: 'てんきよほうによるとあしたははれるらしい'
    en: 'According to the forecast, tomorrow should be sunny.'
    es: 'Según el pronóstico, mañana hará sol.'
  - text: '来月から新しい仕事を始めることになった。'
    reading: 'らいげつからあたらしいしごとをはじめることになった'
    en: 'It has been decided that I start a new job next month.'
    es: 'Ya está decidido: el mes que viene empiezo un trabajo nuevo.'
  - text: '忘れ物をしないように気をつけてください。'
    reading: 'わすれものをしないようにきをつけてください'
    en: 'Please be careful not to leave anything behind.'
    es: 'Ten cuidado de no olvidarte nada.'
  - text: '電車の中では、静かに話しましょう。'
    reading: 'でんしゃのなかではしずかにはなしましょう'
    en: "Let's speak quietly on the train."
    es: 'En el tren, hablemos en voz baja.'
  - text: '京都で古いお寺をたくさん見学した。'
    reading: 'きょうとでふるいおてらをたくさんけんがくした'
    en: 'I visited many old temples in Kyoto.'
    es: 'Visité muchos templos antiguos en Kioto.'
  - text: '疲れていたので、早く寝ることにした。'
    reading: 'つかれていたのではやくねることにした'
    en: 'I was tired, so I decided to go to bed early.'
    es: 'Estaba cansado, así que decidí acostarme pronto.'
  - text: '説明が分かりやすくて、助かりました。'
    reading: 'せつめいがわかりやすくてたすかりました'
    en: 'The explanation was easy to follow, which helped a lot.'
    es: 'La explicación era fácil de entender y me ayudó mucho.'
