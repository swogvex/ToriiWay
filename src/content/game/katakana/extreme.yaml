# Katakana Extreme: short, natural sentences in kana with katakana words, spaces between phrases.
# Original sentences. Particles are typed as written: は = "ha", へ = "he", を = "wo".
script: katakana
difficulty: extreme
items:
  - text: 'コーヒーを のみます。'
    reading: 'コーヒーをのみます'
    en: 'I drink coffee.'
    es: 'Bebo café.'
  - text: 'テレビを みて います。'
    reading: 'テレビをみています'
    en: 'I am watching TV.'
    es: 'Estoy viendo la televisión.'
  - text: 'あしたは テニスを します。'
    reading: 'あしたはテニスをします'
    en: 'Tomorrow I will play tennis.'
    es: 'Mañana voy a jugar al tenis.'
  - text: 'あたらしい カメラを かいました。'
    reading: 'あたらしいカメラをかいました'
    en: 'I bought a new camera.'
    es: 'Me he comprado una cámara nueva.'
  - text: 'バスで がっこうへ いきます。'
    reading: 'バスでがっこうへいきます'
    en: 'I go to school by bus.'
    es: 'Voy a la escuela en autobús.'
  - text: 'パンと ミルクが すきです。'
    reading: 'パンとミルクがすきです'
    en: 'I like bread and milk.'
    es: 'Me gustan el pan y la leche.'
  - text: 'ホテルは えきの ちかくです。'
    reading: 'ホテルはえきのちかくです'
    en: 'The hotel is near the station.'
    es: 'El hotel está cerca de la estación.'
  - text: 'あには ピアノが じょうずです。'
    reading: 'あにはピアノがじょうずです'
    en: 'My older brother is good at the piano.'
    es: 'Mi hermano mayor toca bien el piano.'
  - text: 'レストランで ランチを たべました。'
    reading: 'レストランでランチをたべました'
    en: 'I had lunch at a restaurant.'
    es: 'He comido en un restaurante.'
  - text: 'スマートフォンを わすれました。'
    reading: 'スマートフォンをわすれました'
    en: 'I forgot my smartphone.'
    es: 'Se me ha olvidado el móvil.'
  - text: 'この ラーメンは あついです。'
    reading: 'このラーメンはあついです'
    en: 'This ramen is hot.'
    es: 'Este ramen está caliente.'
  - text: 'エレベーターは どこですか。'
    reading: 'エレベーターはどこですか'
    en: 'Where is the lift?'
    es: '¿Dónde está el ascensor?'
  - text: 'メニューを みせて ください。'
    reading: 'メニューをみせてください'
    en: 'Please show me the menu.'
    es: 'Enséñeme la carta, por favor.'
  - text: 'あさ シャワーを あびます。'
    reading: 'あさシャワーをあびます'
    en: 'I take a shower in the morning.'
    es: 'Me ducho por la mañana.'
  - text: 'タクシーを よびましょう。'
    reading: 'タクシーをよびましょう'
    en: "Let's call a taxi."
    es: 'Llamemos a un taxi.'
  - text: 'パーティーは たのしかったです。'
    reading: 'パーティーはたのしかったです'
    en: 'The party was fun.'
    es: 'La fiesta fue divertida.'
  - text: 'サッカーの しあいを みます。'
    reading: 'サッカーのしあいをみます'
    en: 'I watch a football match.'
    es: 'Veo un partido de fútbol.'
  - text: 'ラジオで ニュースを ききました。'
    reading: 'ラジオでニュースをききました'
    en: 'I heard the news on the radio.'
    es: 'Oí las noticias en la radio.'
  - text: 'いもうとと ケーキを つくりました。'
    reading: 'いもうととケーキをつくりました'
    en: 'I made a cake with my younger sister.'
    es: 'Hice un pastel con mi hermana pequeña.'
  - text: 'アイスクリームが たべたいです。'
    reading: 'アイスクリームがたべたいです'
    en: 'I want to eat ice cream.'
    es: 'Quiero comer helado.'
  - text: 'まいにち ギターを れんしゅうします。'
    reading: 'まいにちギターをれんしゅうします'
    en: 'I practise the guitar every day.'
    es: 'Practico la guitarra todos los días.'
  - text: 'デパートで ジャケットを かいます。'
    reading: 'デパートでジャケットをかいます'
    en: 'I will buy a jacket at the department store.'
    es: 'Voy a comprar una chaqueta en los grandes almacenes.'
