# Home copy, footer phrase and social links (English).
# Section names and buttons such as "Index" live in src/i18n/en.json.

title: ToriiWay · Learn Japanese one keystroke at a time
description: >-
  Free Japanese practice with no account: a kana typing game, kana and kanji guides, JLPT mock
  exams and a library of books worth reading.

hero:
  kicker: Japanese for learners
  kickerMore: free, open, no account needed
  title: Learn Japanese one keystroke at a time.
  # Typed one after another after the fixed "Learn" (keep them about the same length).
  phrases:
    - Learn Japanese one keystroke at a time.
    - Learn your way to JLPT success.
    - Learn through words and stories.
    - Learn Japanese beyond the basics.
    - Learn together, grow together.
    - Learn a language, discover a culture.
  lead: >-
    Type kana against the clock, study every character, practise full JLPT simulations and grab
    the books worth reading.
  primary: Play Kana Rush
  secondary: Start with hiragana

# Home index cards, in order 01–05.
index:
  game:
    kicker: Game
    text: Speed typing for hiragana, katakana and kanji. Pop bubbles before they cross the screen.
  learn:
    kicker: Learn
    text: Kana charts with stroke order, and a kanji dictionary in English and Spanish.
  jlpt:
    kicker: JLPT
    text: Timed mock exams with a score report.
  library:
    kicker: Library
    text: Books by level, skill and language.
  community:
    kicker: Community
    text: Discord server and video lessons.

# The card shows the channel's latest video (title and date come from the feed). The title
# and text below are used only when the feed cannot be read: the card then links to the channel.
video:
  kicker: YouTube · @nihongonotorii
  title: Video lessons on the channel
  text: Short lessons on kana, grammar and the JLPT.

discord:
  kicker: Discord
  title: Study with others on the server
  cta: Join the server

footer:
